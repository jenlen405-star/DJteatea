/* ============================================================================
 * 音訊引擎(瀏覽器端):把 AudioWorklet 的 DeckProcessor 串進節點圖
 *
 *  deck worklet → lpf(刷碟/Filter FX) → wash(Automix 收尾濾波) → low(低頻搖桿,Bass Swap 用)
 *   → Echo → Flanger → Bitcrush → Reverb → vol(音量推桿) → xf(Crossfader) → master → limiter → 喇叭
 * ========================================================================== */

/* ---------- FX 單元(dry/wet 或 send 型) ---------- */
function makeEcho(ctx) {
  const input = ctx.createGain(), output = ctx.createGain(), send = ctx.createGain();
  const delay = ctx.createDelay(2), fb = ctx.createGain(), wet = ctx.createGain();
  send.gain.value = 0; fb.gain.value = 0.45; wet.gain.value = 0.6; delay.delayTime.value = 0.35;
  input.connect(output);
  input.connect(send); send.connect(delay); delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(output);
  return { input, output, send, delay, setTime(t) { delay.delayTime.setTargetAtTime(Math.max(0.02, Math.min(1.9, t)), ctx.currentTime, 0.05); } };
}

function makeReverb(ctx, ir) {
  const input = ctx.createGain(), output = ctx.createGain(), send = ctx.createGain();
  const conv = ctx.createConvolver(), wet = ctx.createGain();
  conv.buffer = ir; send.gain.value = 0; wet.gain.value = 0.8;
  input.connect(output); input.connect(send); send.connect(conv); conv.connect(wet); wet.connect(output);
  return { input, output, send };
}

function makeFlanger(ctx) {
  const input = ctx.createGain(), output = ctx.createGain(), wet = ctx.createGain();
  const delay = ctx.createDelay(0.05), fb = ctx.createGain();
  const lfo = ctx.createOscillator(), depth = ctx.createGain();
  delay.delayTime.value = 0.004; fb.gain.value = 0.55; wet.gain.value = 0;
  lfo.frequency.value = 0.27; depth.gain.value = 0.0028;
  lfo.connect(depth); depth.connect(delay.delayTime); lfo.start();
  input.connect(output); input.connect(delay); delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(output);
  return { input, output, wet };
}

function makeReverbIR(ctx, seconds) {
  const sr = ctx.sampleRate, len = Math.floor(sr * seconds), buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let lp = 0, seed = 12345 + ch * 777;
    for (let i = 0; i < len; i++) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const n = seed / 4294967296 * 2 - 1, t = i / len;
      lp += (0.25 + 0.5 * (1 - t)) * (n - lp);            // 越到尾巴越暗
      d[i] = lp * Math.pow(1 - t, 3.2) * (i < sr * 0.012 ? i / (sr * 0.012) : 1);
    }
  }
  return buf;
}

/* ---------- iOS 音訊解鎖 ---------- */
function unlockIOSAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  // 播放無聲 <audio>,讓 iOS 把 session 切到 playback:靜音開關打開時 Web Audio 也能出聲
  try {
    const wav = encodeWav16(new Float32Array(2205), 22050);
    const a = document.createElement('audio');
    a.src = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
    a.loop = true; a.setAttribute('playsinline', ''); a.play().catch(() => {});
    window.__silentAudio = a;
  } catch (e) {}
}

/* ---------- 單一 Deck ---------- */
class DeckChannel {
  constructor(engine, id) {
    const ctx = engine.ctx;
    this.engine = engine; this.ctx = ctx; this.id = id;
    this.node = new AudioWorkletNode(ctx, 'deck-processor', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    this.node.port.onmessage = (e) => this._onMsg(e.data);

    const biq = (type, f, g) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (g != null) b.gain.value = g; return b; };
    this.lpf = biq('lowpass', 20000); this.lpf.Q.value = 0.7;
    this.wash = biq('lowpass', 20000); this.wash.Q.value = 0.5;
    this.low = biq('lowshelf', 180, 0);
    this.echo = makeEcho(ctx); this.flanger = makeFlanger(ctx); this.reverb = makeReverb(ctx, engine.reverbIR);
    this.crush = new AudioWorkletNode(ctx, 'bitcrush', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
    this.vol = ctx.createGain(); this.xf = ctx.createGain();
    this.analyser = ctx.createAnalyser(); this.analyser.fftSize = 512;
    this._meterBuf = new Float32Array(512);

    this.node.connect(this.lpf); this.lpf.connect(this.wash); this.wash.connect(this.low);
    this.low.connect(this.echo.input); this.echo.output.connect(this.flanger.input);
    this.flanger.output.connect(this.crush); this.crush.connect(this.reverb.input);
    this.reverb.output.connect(this.vol); this.vol.connect(this.analyser); this.vol.connect(this.xf);
    this.xf.connect(engine.master);

    this.meta = null; this.loaded = false; this.loading = false; this.N = 0; this.peaks = null;
    this.rep = { pos: 0, frame: 0, rate: 0, t: performance.now(), playing: false, scratch: false, loop: { on: false, a: 0, b: 0 } };
    this.tempoRatio = 1; this.tempoRange = 0.16; this.keylock = true;
    this.volume = 0.85; this.cue = 0; this.loopBeats = 4;
    this.fx = { filter: false, echo: false, reverb: false, flanger: false, crush: false };
    this.scratching = false; this.scratchRateUI = 0;
    this.onchange = null;
    this.setVolume(0.85);
  }

  _post(m, transfer) { this.node.port.postMessage(m, transfer || []); }
  _emit(what) { if (this.onchange) this.onchange(what); }

  _onMsg(m) {
    if (m.t === 'pos') {
      const was = this.rep.playing, wasLoop = this.rep.loop.on;
      this.rep = { pos: m.pos, frame: m.frame, rate: m.rate, t: performance.now(), playing: m.playing, scratch: m.scratch, loop: m.loop };
      if (was !== m.playing || wasLoop !== m.loop.on) this._emit('state');
    } else if (m.t === 'ended') {
      this._emit('state'); this.engine.emit('ended', this);
    }
  }

  /* ----- 載入 ----- */
  loadAudio(buf, meta) {
    const L = new Float32Array(buf.getChannelData(0));
    const R = buf.numberOfChannels > 1 ? new Float32Array(buf.getChannelData(1)) : null;
    this.peaks = computePeaks(L, R || L, 900);
    this.N = L.length; this.meta = meta; this.loaded = true; this.loading = false;
    this.cue = Math.round((meta.offset || 0) * this.ctx.sampleRate);
    this.rep = { pos: 0, frame: 0, rate: 0, t: performance.now(), playing: false, scratch: false, loop: { on: false, a: 0, b: 0 } };
    this._post({ t: 'load', L, R }, R ? [L.buffer, R.buffer] : [L.buffer]);
    this.setTempoRatio(1);
    this.setKeylock(this.keylock);
    this._emit('load');
  }

  /* ----- 時間/位置 ----- */
  getPosSamples() {
    if (!this.loaded) return 0;
    const r = this.rep, dt = (performance.now() - r.t) / 1000;
    let p = r.pos + dt * r.rate * this.ctx.sampleRate;
    if (r.loop.on && p >= r.loop.b) p = r.loop.a + ((p - r.loop.a) % (r.loop.b - r.loop.a));
    return Math.max(0, Math.min(this.N, p));
  }
  getPosSec() { return this.getPosSamples() / this.ctx.sampleRate; }
  duration() { return this.loaded ? this.N / this.ctx.sampleRate : 0; }
  effectiveBpm() { return this.meta && this.meta.bpm ? this.meta.bpm * this.tempoRatio : 0; }
  get playing() { return this.rep.playing; }

  _freeze(playing, rate) {   // 樂觀更新,讓 UI 不必等 worklet 回報
    this.rep = Object.assign({}, this.rep, { pos: this.getPosSamples(), t: performance.now(), playing, rate });
  }

  /* ----- 傳輸控制 ----- */
  play() { if (!this.loaded) return; this._post({ t: 'play' }); this._freeze(true, this.tempoRatio); this._emit('state'); }
  pause() { if (!this.loaded) return; this._post({ t: 'pause' }); this._freeze(false, 0); this._emit('state'); }
  togglePlay() { this.rep.playing ? this.pause() : this.play(); }
  playAt(frame) { this._post({ t: 'playAt', frame }); }
  seekSamples(p) { if (!this.loaded) return; this._post({ t: 'seek', pos: p }); this._freeze(this.rep.playing, this.rep.rate); this.rep.pos = p; }
  seekSec(s) { this.seekSamples(s * this.ctx.sampleRate); }
  /* CDJ 式 Cue:播放中按 = 回到 Cue 點並暫停;暫停中按 = 把目前位置設為 Cue 點 */
  cueButton() {
    if (!this.loaded) return;
    if (this.rep.playing) { this.pause(); this.seekSamples(this.cue); }
    else { this.cue = this.getPosSamples(); this._emit('cue'); }
  }

  /* ----- 速度 ----- */
  setTempoRatio(r) {
    const lo = 1 - this.tempoRange, hi = 1 + this.tempoRange;
    this.tempoRatio = Math.max(lo, Math.min(hi, r));
    this._post({ t: 'tempo', v: this.tempoRatio });
    this._updateEchoTime(); this._emit('tempo');
  }
  setTempoRange(range) { this.tempoRange = range; this.setTempoRatio(this.tempoRatio); }
  setKeylock(on) { this.keylock = !!on; this._post({ t: 'keylock', on: this.keylock }); this._emit('keylock'); }

  /* SYNC:速度對齊另一個 deck,若兩邊都在播放再把拍點相位對齊 */
  syncTo(other) {
    if (!this.loaded || !other || !other.loaded || !this.meta.bpm || !other.effectiveBpm()) return false;
    const m = matchTempoRatio(this.meta.bpm, other.effectiveBpm(), this.tempoRange);
    this.setTempoRatio(m.ratio);
    if (this.rep.playing && other.rep.playing && this.meta.offset != null && other.meta.offset != null) {
      const sr = this.ctx.sampleRate, F = Math.max(this.rep.frame, other.rep.frame);
      const at = (d) => d.rep.pos + (F - d.rep.frame) * d.rep.rate;           // 兩邊都推算到同一個 context frame,不受訊息延遲影響
      const beatThis = 60 / (this.meta.bpm * m.mult), beatOther = 60 / other.meta.bpm;
      const ph = (d, beat) => { const x = (at(d) / sr - d.meta.offset) / beat; return x - Math.floor(x); };
      let d = ph(other, beatOther) - ph(this, beatThis);
      d -= Math.round(d);                                                       // 取 [-0.5, 0.5)
      this._post({ t: 'nudge', delta: d * beatThis * sr });
    }
    return true;
  }

  /* ----- Loop(進點量化到最近拍點) ----- */
  _beatSamples() { return 60 / ((this.meta && this.meta.bpm) || 120) * this.ctx.sampleRate; }
  loopIn(beats) {
    if (!this.loaded) return;
    const sr = this.ctx.sampleRate, bs = this._beatSamples(), grid = ((this.meta && this.meta.offset) || 0) * sr;
    const a = grid + Math.round((this.getPosSamples() - grid) / bs) * bs;
    this._post({ t: 'loop', a, b: a + beats * bs });
  }
  loopOff() { this._post({ t: 'loopOff' }); this.rep.loop = Object.assign({}, this.rep.loop, { on: false }); this._emit('state'); }
  toggleLoop() { this.rep.loop.on ? this.loopOff() : this.loopIn(this.loopBeats); }
  setLoopBeats(b) {
    this.loopBeats = b;
    if (this.rep.loop.on) { const a = this.rep.loop.a; this._post({ t: 'loop', a, b: a + b * this._beatSamples() }); }
    this._emit('loopsize');
  }

  /* ----- 音量 / FX ----- */
  setVolume(v) { this.volume = v; this.vol.gain.setTargetAtTime(v * v, this.ctx.currentTime, 0.015); }
  _updateEchoTime() { const b = this.effectiveBpm(); this.echo.setTime(b ? 60 / b * 0.75 : 0.35); }
  _updateLpf() {
    let f = 20000, q = 0.7;
    if (this.fx.filter) { f = 900; q = 4; }
    if (this.scratching) { f = Math.min(f, 1200 + 7000 * Math.min(3, Math.abs(this.scratchRateUI))); q = Math.max(q, 1.5); }
    const tc = this.scratching ? 0.01 : 0.08, t = this.ctx.currentTime;
    this.lpf.frequency.setTargetAtTime(f, t, tc); this.lpf.Q.setTargetAtTime(q, t, tc);
  }
  setFx(name, on) {
    this.fx[name] = on; const t = this.ctx.currentTime;
    if (name === 'filter') this._updateLpf();
    else if (name === 'echo') { this._updateEchoTime(); this.echo.send.gain.setTargetAtTime(on ? 0.7 : 0, t, 0.02); }
    else if (name === 'reverb') this.reverb.send.gain.setTargetAtTime(on ? 0.55 : 0, t, 0.03);
    else if (name === 'flanger') this.flanger.wet.gain.setTargetAtTime(on ? 0.75 : 0, t, 0.03);
    else if (name === 'crush') this.crush.parameters.get('mix').setTargetAtTime(on ? 1 : 0, t, 0.02);
    this._emit('fx');
  }

  /* ----- 刷碟 ----- */
  scratchStart() { if (!this.loaded) return false; this.scratching = true; this.scratchRateUI = 0; this._post({ t: 'scratchStart' }); this._updateLpf(); return true; }
  scratchMove(rate) { this.scratchRateUI = rate; this._post({ t: 'scratchRate', v: rate }); this._updateLpf(); }
  scratchEnd() { if (!this.scratching) return; this.scratching = false; this._post({ t: 'scratchEnd' }); this._updateLpf(); }

  /* ----- UI 用的即時資訊 ----- */
  beatState() {
    if (!this.meta || !this.meta.bpm) return null;
    const beat = 60 / this.meta.bpm, x = (this.getPosSec() - (this.meta.offset || 0)) / beat, i = Math.floor(x);
    return { n: ((i % 4) + 4) % 4, phase: x - i };
  }
  level() {
    this.analyser.getFloatTimeDomainData(this._meterBuf);
    let m = 0; for (let i = 0; i < this._meterBuf.length; i++) { const v = Math.abs(this._meterBuf[i]); if (v > m) m = v; }
    return m;
  }
}

/* 產生波形總覽用的 min/max 峰值 */
function computePeaks(L, R, cols) {
  const N = L.length, step = N / cols, out = new Float32Array(cols * 2);
  for (let c = 0; c < cols; c++) {
    const s = Math.floor(c * step), e = Math.min(N, Math.floor((c + 1) * step));
    let mn = 0, mx = 0, inc = Math.max(1, Math.floor((e - s) / 64));
    for (let i = s; i < e; i += inc) { const v = 0.5 * (L[i] + R[i]); if (v < mn) mn = v; if (v > mx) mx = v; }
    out[c * 2] = mn; out[c * 2 + 1] = mx;
  }
  return out;
}

/* ---------- Engine ---------- */
class Engine {
  constructor() { this.ctx = null; this.ready = false; this.decks = {}; this.xfPos = 0; this.listeners = {}; this.automated = false; }
  on(ev, fn) { (this.listeners[ev] = this.listeners[ev] || []).push(fn); }
  emit(ev, a) { (this.listeners[ev] || []).forEach(f => f(a)); }

  async init(workletUrl) {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('這個瀏覽器不支援 Web Audio');
    this.ctx = new AC({ latencyHint: 'interactive' });
    if (!this.ctx.audioWorklet) throw new Error('需要 iOS 14.5 以上(支援 AudioWorklet)');
    unlockIOSAudio();
    try { await this.ctx.resume(); } catch (e) {}
    await this.ctx.audioWorklet.addModule(workletUrl);

    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    this.limiter = this.ctx.createDynamicsCompressor();
    Object.assign(this.limiter.threshold, { value: -3 }); this.limiter.knee.value = 2;
    this.limiter.ratio.value = 18; this.limiter.attack.value = 0.003; this.limiter.release.value = 0.12;
    this.master.connect(this.limiter); this.limiter.connect(this.ctx.destination);

    this.reverbIR = makeReverbIR(this.ctx, 2.2);
    this.decks.A = new DeckChannel(this, 'A');
    this.decks.B = new DeckChannel(this, 'B');
    this.setCrossfader(0, true);
    this.ctx.onstatechange = () => this.emit('state', this.ctx.state);
    this.ready = true;
  }

  resume() { if (this.ctx && this.ctx.state !== 'running') return this.ctx.resume().catch(() => {}); }

  decode(arrayBuffer) {
    return new Promise((res, rej) => {
      const p = this.ctx.decodeAudioData(arrayBuffer, res, rej);
      if (p && p.catch) p.catch(rej);
    });
  }

  /* 等功率 Crossfader:p ∈ [-1(全A), 1(全B)] */
  static xfGains(p) { const th = (p + 1) / 2 * Math.PI / 2; return { a: Math.cos(th), b: Math.sin(th) }; }
  setCrossfader(p, instant) {
    this.xfPos = Math.max(-1, Math.min(1, p));
    const g = Engine.xfGains(this.xfPos), t = this.ctx.currentTime;
    for (const [id, v] of [['A', g.a], ['B', g.b]]) {
      const P = this.decks[id].xf.gain;
      P.cancelScheduledValues(t);
      if (instant) P.setValueAtTime(v, t); else P.setTargetAtTime(v, t, 0.012);
    }
    this.automated = false;
  }
}

/* ============================================================================
 * Automix:自動混音
 *  1. 佇列依「Camelot 調性相容 + BPM 接近」排序(sortByHarmony)
 *  2. 目前曲子剩下 (過渡長度 + 8 秒) 時,把下一首預先載入到閒置的 deck
 *  3. 過渡開始點對齊目前曲子的「下一個小節線」:算出該小節線的 context frame,
 *     用 worklet 的 playAt(frame) 在「那一個取樣點」起播,兩首拍點就會自然疊合
 *  4. Crossfader 用 AudioParam.setValueCurveAtTime 排程(不靠主執行緒計時器),
 *     搭配 Bass Swap(舊曲低頻退、新曲低頻進)與舊曲的收尾低通濾波
 * ========================================================================== */
class Automix {
  constructor(app) {
    this.app = app;
    this.running = false; this.phase = 'idle';       // idle | playing | transition
    this.queue = []; this.activeId = 'A'; this.trans = null;
    this.nextMeta = null; this.nextReady = false; this.prepToken = 0;
    this.opts = { beats: 16, bassSwap: true, wash: true };
    this.timer = null; this.rampTimer = null;
    this.onchange = null;
    this.current = null;
  }
  get eng() { return this.app.engine; }
  deck(id) { return this.eng.decks[id]; }
  idleId() { return this.activeId === 'A' ? 'B' : 'A'; }
  _emit() { if (this.onchange) this.onchange(); }

  async start(list) {
    if (!list.length) return;
    this.queue = list.slice(); this.running = true; this.phase = 'starting'; this._emit();
    const first = this.queue.shift(); this.current = first;
    this.activeId = 'A';
    try { await this.app.loadToDeck('A', first); }
    catch (e) { this.stop(); throw e; }
    const d = this.deck('A');
    d.setKeylock(true); d.setTempoRatio(1); d.seekSamples(d.cue);
    this.eng.setCrossfader(-1, true);
    d.play();
    this.phase = 'playing';
    this.timer = setInterval(() => this.tick(), 250);
    this._prepareNext(); this._emit();
  }

  stop() {
    if (this.timer) clearInterval(this.timer); this.timer = null;
    if (this.rampTimer) clearInterval(this.rampTimer); this.rampTimer = null;
    if (this.phase === 'transition') {           // 中途停止:凍結在目前的 Crossfader 位置,並還原 EQ / 濾波
      const p = this.crossfaderPos(); this.eng.setCrossfader(p == null ? this.eng.xfPos : p, true);
      for (const id of ['A', 'B']) this._resetDeckFx(this.deck(id));
    }
    this.running = false; this.phase = 'idle'; this.trans = null; this.prepToken++;
    this._emit();
  }

  _resetDeckFx(d) {
    const t = this.eng.ctx.currentTime;
    d.low.gain.cancelScheduledValues(t); d.low.gain.setValueAtTime(0, t);
    d.wash.frequency.cancelScheduledValues(t); d.wash.frequency.setValueAtTime(20000, t);
  }

  async _prepareNext() {
    const token = ++this.prepToken;
    this.nextReady = false; this.nextMeta = this.queue[0] || null;
    if (!this.nextMeta) { this._emit(); return; }
    try {
      await this.app.loadToDeck(this.idleId(), this.nextMeta);
      if (token !== this.prepToken || !this.running) return;
      this.nextReady = true;
    } catch (e) {
      if (token !== this.prepToken) return;
      this.app.toast('載入下一首失敗:' + e.message);
      this.queue.shift(); this._prepareNext(); return;
    }
    this._emit();
  }

  remainingSec() {
    const a = this.deck(this.activeId);
    return a.loaded ? (a.duration() - a.getPosSec()) / Math.max(0.5, a.tempoRatio) : 0;
  }

  tick() {
    if (!this.running) return;
    const eng = this.eng, a = this.deck(this.activeId);
    if (this.phase === 'playing') {
      const remain = this.remainingSec();
      const bpm = a.effectiveBpm() || 124, D = this.opts.beats * 60 / bpm;
      if (this.nextReady && (remain <= D + 8)) this.beginTransition(D, remain);
      else if (!this.nextMeta && this.queue.length === 0 && !a.playing && remain < 0.5) { this.stop(); this.app.toast('Automix 已播完佇列'); }
    } else if (this.phase === 'transition') {
      if (eng.ctx.currentTime >= this.trans.end + 0.2) this.finishTransition();
    }
    this._emit();
  }

  /* 立即開始過渡(使用者按「下一首」);beats 縮短為 8 拍 */
  skip() {
    if (!this.running || this.phase !== 'playing' || !this.nextReady) return;
    const a = this.deck(this.activeId), bpm = a.effectiveBpm() || 124;
    this.beginTransition(8 * 60 / bpm, this.remainingSec());
  }

  beginTransition(D, remain) {
    const eng = this.eng, ctx = eng.ctx, sr = ctx.sampleRate;
    const out = this.deck(this.activeId), inn = this.deck(this.idleId());
    const om = out.meta, im = inn.meta;
    if (out.rep.loop.on) out.loopOff();

    // 1) 新曲速度貼齊舊曲目前的有效 BPM(必要時倍速/半速),Key Lock 打開所以音高不變
    const outBpm = out.effectiveBpm();
    inn.setKeylock(true);
    if (im.bpm && outBpm) inn.setTempoRatio(matchTempoRatio(im.bpm, outBpm, 0.16).ratio);
    inn.seekSamples(Math.round((im.offset || 0) * sr));

    // 2) 找出舊曲下一個小節線的 context frame(至少 0.35 秒後)
    const minFrame = Math.round((ctx.currentTime + 0.35) * sr);
    let F = minFrame;
    const r = out.rep, rate = r.rate > 0.1 ? r.rate : out.tempoRatio;
    if (om.bpm && out.playing) {
      const barDur = 4 * 60 / om.bpm, off = om.offset || 0;
      let k = Math.ceil((r.pos / sr - off) / barDur);
      for (let n = 0; n < 8; n++, k++) {
        const bpos = (off + k * barDur) * sr;
        F = r.frame + (bpos - r.pos) / rate;
        if (F >= minFrame) break;
      }
      F = Math.round(F);
    }
    const T0 = F / sr, tNow = ctx.currentTime;
    // 3) 若舊曲快播完了,縮短過渡,確保在曲終前完成
    const room = tNow + remain - T0 - 0.3;
    if (room < D) D = Math.max(2, room);

    inn.playAt(F);
    eng.setCrossfader(this.activeId === 'A' ? -1 : 1, true);
    this._automate(out, inn, T0, D);
    this.trans = { start: T0, end: T0 + D, dur: D, from: this.activeId };
    this.phase = 'transition';
    this.app.toast('混音:' + (om.title || '') + ' → ' + (im.title || ''));
    this._emit();
  }

  _automate(out, inn, T0, D) {
    const eng = this.eng, now = eng.ctx.currentTime, n = 96;
    const p0 = out.id === 'A' ? -1 : 1, p1 = -p0;
    const cOut = new Float32Array(n), cIn = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1), e = x * x * (3 - 2 * x);                 // smoothstep
      const g = Engine.xfGains(p0 + (p1 - p0) * e);
      const isA = out.id === 'A';
      cOut[i] = isA ? g.a : g.b; cIn[i] = isA ? g.b : g.a;
    }
    const g0 = Engine.xfGains(p0), oG = out.xf.gain, iG = inn.xf.gain;
    oG.cancelScheduledValues(now); iG.cancelScheduledValues(now);
    oG.setValueAtTime(out.id === 'A' ? g0.a : g0.b, now); iG.setValueAtTime(out.id === 'A' ? g0.b : g0.a, now);
    oG.setValueCurveAtTime(cOut, T0, D); iG.setValueCurveAtTime(cIn, T0, D);
    eng.automated = true;

    if (this.opts.bassSwap) {          // 前半段只聽舊曲低頻,中點快速交換,後半段只聽新曲低頻
      const lo = -32, a0 = T0 + 0.42 * D, a1 = T0 + 0.58 * D;
      inn.low.gain.cancelScheduledValues(now); inn.low.gain.setValueAtTime(lo, now);
      inn.low.gain.setValueAtTime(lo, a0); inn.low.gain.linearRampToValueAtTime(0, a1);
      out.low.gain.cancelScheduledValues(now); out.low.gain.setValueAtTime(0, now);
      out.low.gain.setValueAtTime(0, a0); out.low.gain.linearRampToValueAtTime(lo, a1);
    }
    if (this.opts.wash) {              // 舊曲後半段逐漸被低通濾掉,像慢慢沉入水中
      out.wash.frequency.cancelScheduledValues(now); out.wash.frequency.setValueAtTime(20000, now);
      out.wash.frequency.setValueAtTime(20000, T0 + 0.5 * D);
      out.wash.frequency.exponentialRampToValueAtTime(700, T0 + D);
    }
  }

  crossfaderPos() {
    if (this.phase !== 'transition' || !this.trans) return null;
    const x = Math.max(0, Math.min(1, (this.eng.ctx.currentTime - this.trans.start) / this.trans.dur));
    const e = x * x * (3 - 2 * x), p0 = this.trans.from === 'A' ? -1 : 1;
    return p0 + (-2 * p0) * e;
  }

  finishTransition() {
    const out = this.deck(this.activeId), inn = this.deck(this.idleId());
    out.pause(); this._resetDeckFx(out); inn.low.gain.setValueAtTime(0, this.eng.ctx.currentTime);
    this.activeId = inn.id; this.queue.shift(); this.current = inn.meta;
    this.eng.xfPos = inn.id === 'A' ? -1 : 1; this.eng.automated = false;
    this.phase = 'playing'; this.trans = null;
    this._rampTempoBack(inn);
    this._prepareNext(); this._emit();
  }

  /* 過渡後,新曲的速度在約 30 秒內慢慢回到原速,避免 BPM 一路被前一首拖著走 */
  _rampTempoBack(deck) {
    if (this.rampTimer) clearInterval(this.rampTimer);
    const r0 = deck.tempoRatio; if (Math.abs(r0 - 1) < 0.002) return;
    const t0 = performance.now(), dur = 30000; let expect = r0;
    this.rampTimer = setInterval(() => {
      if (!this.running || Math.abs(deck.tempoRatio - expect) > 0.0006) { clearInterval(this.rampTimer); return; }   // 使用者動了推桿就放手
      const x = Math.min(1, (performance.now() - t0) / dur);
      deck.setTempoRatio(r0 + (1 - r0) * x); expect = deck.tempoRatio;
      if (x >= 1) clearInterval(this.rampTimer);
    }, 400);
  }

  statusText() {
    if (!this.running) return '';
    if (this.phase === 'transition' && this.trans) {
      const x = Math.max(0, Math.min(1, (this.eng.ctx.currentTime - this.trans.start) / this.trans.dur));
      return x <= 0 ? '準備混入下一首…' : '混音中 ' + Math.round(x * 100) + '%';
    }
    return this.nextMeta ? (this.nextReady ? '下一首已就緒' : '載入下一首…') : '最後一首';
  }
}

/* ============================================================================
 * UI:推桿、Deck 面板(刷碟手勢、波形總覽、拍點 LED)、歌單/Automix、音源
 * ========================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmtTime(s) { if (!isFinite(s)) s = 0; s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function keyColor(code) {
  const n = parseInt(code, 10); if (!n) return '#6b6e79';
  return 'hsl(' + ((n - 1) * 30 + 10) + ' 72% ' + (String(code).endsWith('B') ? '70%' : '62%') + ')';
}
let _toastTimer = null;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2600);
}

/* ---------- 推桿 ---------- */
function bindFader(el, opt) {
  // opt: { vertical, get(): 0..1, set(v, final), onDouble() }
  const cap = $('.cap', el); let dragging = false, lastUp = 0, moved = false;
  const place = (v) => {
    if (opt.vertical) cap.style.top = 'calc(10px + (100% - 20px) * ' + (1 - v) + ')';
    else cap.style.left = 'calc(24px + (100% - 48px) * ' + v + ')';
  };
  const fromEvent = (e) => {
    const r = el.getBoundingClientRect();
    return opt.vertical ? clamp(1 - (e.clientY - r.top - 10) / (r.height - 20), 0, 1) : clamp((e.clientX - r.left - 24) / (r.width - 48), 0, 1);
  };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); dragging = true; moved = false;
    const v = fromEvent(e); place(v); opt.set(v, false);
  });
  el.addEventListener('pointermove', (e) => { if (!dragging) return; moved = true; const v = fromEvent(e); place(v); opt.set(v, false); });
  const end = (e) => {
    if (!dragging) return; dragging = false;
    const now = performance.now();
    if (!moved && now - lastUp < 320 && opt.onDouble) { opt.onDouble(); lastUp = 0; return; }
    lastUp = now; if (opt.final) opt.final();
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  return { place, get dragging() { return dragging; } };
}

/* ---------- Deck 介面 ---------- */
function deckTemplate(id) {
  const loopSz = [['¼', 0.25], ['½', 0.5], ['1', 1], ['2', 2], ['4', 4], ['8', 8]]
    .map(([t, b]) => '<button class="btn sz" data-b="' + b + '">' + t + '</button>').join('');
  const fx = [['filter', 'Filter'], ['echo', 'Echo'], ['reverb', 'Reverb'], ['flanger', 'Flanger'], ['crush', 'Crush']]
    .map(([k, t]) => '<button class="btn" data-fx="' + k + '">' + t + '</button>').join('');
  return '' +
    '<div class="info"><div class="trk"><div class="t" data-k="title">尚未載入曲目</div><div class="s" data-k="sub">Deck ' + id + ' · 到「歌單」載入</div></div>' +
    '<div class="key" data-k="key">–</div><div class="bpm"><b data-k="bpm">--.-</b><i data-k="pct">0.0%</i></div></div>' +
    '<div class="wave" data-k="wave"><canvas></canvas><span class="tm l" data-k="tel">0:00</span><span class="tm" data-k="trm">-0:00</span></div>' +
    '<div class="fader tempo" data-k="tempo"><div class="rail"></div><div class="ticks"></div><div class="mid"></div><div class="cap"></div></div>' +
    '<div class="platcell" data-k="platcell"><div class="platter" data-k="platter"><div class="disc" data-k="disc"><div class="lab"></div></div>' +
    '<div class="leds" data-k="leds"><i></i><i></i><i></i><i></i></div></div><div class="nofile" data-k="nofile">尚未載入曲目</div></div>' +
    '<div class="fader vol" data-k="vol"><div class="rail"></div><div class="ticks"></div><div class="meter"><i data-k="vu"></i></div><div class="cap"></div></div>' +
    '<div class="ctl"><button class="btn" data-k="cue">Cue</button><button class="btn play" data-k="play">▶</button>' +
    '<button class="btn" data-k="sync">Sync</button><button class="btn on" data-k="keylock">Key</button></div>' +
    '<div class="pads row-loop"><button class="btn lp" data-k="loop">Loop</button>' + loopSz + '<button class="btn bankbtn" data-k="bank1">FX</button></div>' +
    '<div class="pads row-fx">' + fx + '<button class="btn bankbtn" data-k="bank2">Loop</button></div>';
}

class DeckUI {
  constructor(app, deck, root) {
    this.app = app; this.deck = deck; this.root = root;
    root.innerHTML = deckTemplate(deck.id); root.classList.add('bank-loop');
    const q = (k) => $('[data-k="' + k + '"]', root);
    this.el = {}; ['title', 'sub', 'key', 'bpm', 'pct', 'wave', 'tel', 'trm', 'tempo', 'platcell', 'platter', 'disc', 'leds', 'nofile', 'vol', 'vu', 'cue', 'play', 'sync', 'keylock', 'loop', 'bank1', 'bank2']
      .forEach(k => this.el[k] = q(k));
    this.canvas = $('canvas', this.el.wave); this.g = this.canvas.getContext('2d');
    this.cache = null; this.cacheKey = ''; this.last = {};
    this._bindTransport(); this._bindFaders(); this._bindPlatter(); this._bindWave(); this._sizeObserver();
    deck.onchange = (what) => { if (what === 'load') this.cacheKey = ''; this.refresh(); };
    this.refresh();
  }

  _set(k, v, fn) { if (this.last[k] !== v) { this.last[k] = v; fn(v); } }

  _bindTransport() {
    const d = this.deck, e = this.el, root = this.root, other = () => this.app.engine.decks[d.id === 'A' ? 'B' : 'A'];
    e.play.addEventListener('click', () => { if (d.loaded) d.togglePlay(); else toast('先到「歌單」載入一首曲子'); });
    e.cue.addEventListener('click', () => d.cueButton());
    e.sync.addEventListener('click', () => { if (!d.syncTo(other())) toast('Sync 需要兩軌都載入且已有 BPM'); });
    e.keylock.addEventListener('click', () => d.setKeylock(!d.keylock));
    e.loop.addEventListener('click', () => { if (d.loaded) d.toggleLoop(); });
    $$('.sz', root).forEach(b => b.addEventListener('click', () => d.setLoopBeats(parseFloat(b.dataset.b))));
    $$('[data-fx]', root).forEach(b => b.addEventListener('click', () => d.setFx(b.dataset.fx, !d.fx[b.dataset.fx])));
    e.bank1.addEventListener('click', () => { root.classList.remove('bank-loop'); root.classList.add('bank-fx'); });
    e.bank2.addEventListener('click', () => { root.classList.remove('bank-fx'); root.classList.add('bank-loop'); });
  }

  _bindFaders() {
    const d = this.deck;
    const tempoToV = () => clamp(0.5 + (d.tempoRatio - 1) / (2 * d.tempoRange), 0, 1);
    this.tempoFader = bindFader(this.el.tempo, {
      vertical: true,
      set: (v) => { if (this.app.automix.running) this.app.automix.rampTimer && clearInterval(this.app.automix.rampTimer);
        if (Math.abs(v - 0.5) < 0.018) v = 0.5;
        d.setTempoRatio(1 + (v - 0.5) * 2 * d.tempoRange); },
      onDouble: () => { d.setTempoRatio(1); this.tempoFader.place(0.5); },
    });
    this.volFader = bindFader(this.el.vol, { vertical: true, set: (v) => d.setVolume(v) });
    this._tempoToV = tempoToV;
    this.volFader.place(d.volume); this.tempoFader.place(0.5);
  }

  /* 刷碟:手指按住轉盤 = 播放頭停住;順時針/逆時針滑動 = 依角速度映射成播放速率(負值=倒轉) */
  _bindPlatter() {
    const d = this.deck, pl = this.el.platter, self = this;
    let active = false, center = null, lastAng = 0, lastT = 0, lastMove = 0, target = 0, sent = 0;
    const ANG_PER_SEC_AT_1X = 2 * Math.PI / 1.8;      // 33⅓ 轉/分:一圈 1.8 秒
    pl.addEventListener('pointerdown', (e) => {
      if (!d.loaded) return;
      e.preventDefault(); pl.setPointerCapture(e.pointerId);
      const r = pl.getBoundingClientRect(); center = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      lastAng = Math.atan2(e.clientY - center.y, e.clientX - center.x); lastT = e.timeStamp; lastMove = performance.now();
      target = 0; sent = 0; active = true; pl.classList.add('touch');
      d.scratchStart();
    });
    pl.addEventListener('pointermove', (e) => {
      if (!active) return;
      const ang = Math.atan2(e.clientY - center.y, e.clientX - center.x);
      let da = ang - lastAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
      const dt = Math.max(4, e.timeStamp - lastT) / 1000;
      target = 0.55 * target + 0.45 * ((da / dt) / ANG_PER_SEC_AT_1X);
      lastAng = ang; lastT = e.timeStamp; lastMove = performance.now();
    });
    const end = () => { if (!active) return; active = false; pl.classList.remove('touch'); d.scratchEnd(); };
    pl.addEventListener('pointerup', end); pl.addEventListener('pointercancel', end);
    // 每個畫面更新送一次速率;手指停住(超過 60ms 沒有移動事件)就把速率拉回 0
    this.scratchTick = () => {
      if (!active) return;
      if (performance.now() - lastMove > 60) target = 0;
      if (Math.abs(target - sent) > 0.004) { sent = target; d.scratchMove(target); }
    };
  }

  _bindWave() {
    const w = this.el.wave, d = this.deck; let drag = false;
    const seek = (e) => { if (!d.loaded) return; const r = w.getBoundingClientRect(); d.seekSamples(clamp((e.clientX - r.left) / r.width, 0, 1) * d.N); };
    w.addEventListener('pointerdown', (e) => { drag = true; w.setPointerCapture(e.pointerId); seek(e); });
    w.addEventListener('pointermove', (e) => { if (drag) seek(e); });
    w.addEventListener('pointerup', () => drag = false); w.addEventListener('pointercancel', () => drag = false);
  }

  _sizeObserver() {
    const upd = () => { const r = this.el.platcell.getBoundingClientRect(); this.el.platter.style.setProperty('--p', Math.max(70, Math.floor(Math.min(r.width, r.height - 8) - 6)) + 'px'); };
    if (window.ResizeObserver) new ResizeObserver(upd).observe(this.el.platcell); else window.addEventListener('resize', upd);
    upd();
  }

  refresh() {
    const d = this.deck, e = this.el, m = d.meta;
    e.title.textContent = d.loading ? '載入中…' : (m ? m.title : '尚未載入曲目');
    e.sub.textContent = d.loading ? '解碼音訊' : (m ? (m.artist || 'Deck ' + d.id) + (m.bpm ? '' : ' · 尚無 BPM') : 'Deck ' + d.id + ' · 到「歌單」載入');
    e.key.textContent = (m && m.key) || '–'; e.key.style.background = m && m.key ? keyColor(m.key) : ''; e.key.style.color = m && m.key ? '#17181c' : '';
    const bpm = d.effectiveBpm();
    e.bpm.textContent = bpm ? bpm.toFixed(1) : '--.-';
    const pct = (d.tempoRatio - 1) * 100; e.pct.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    e.play.textContent = d.playing ? '❚❚' : '▶'; e.play.classList.toggle('on', d.playing);
    e.keylock.classList.toggle('on', d.keylock); e.loop.classList.toggle('on', !!d.rep.loop.on);
    $$('.sz', this.root).forEach(b => b.classList.toggle('on', parseFloat(b.dataset.b) === d.loopBeats));
    $$('[data-fx]', this.root).forEach(b => b.classList.toggle('on', !!d.fx[b.dataset.fx]));
    e.nofile.style.display = d.loaded ? 'none' : ''; e.disc.style.opacity = d.loaded ? 1 : .45;
    if (!this.tempoFader.dragging) this.tempoFader.place(this._tempoToV());
  }

  _buildCache(w, h, dpr) {
    const d = this.deck, pk = d.peaks; if (!pk) { this.cache = null; return; }
    const mk = (color) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      g.fillStyle = color; const cols = pk.length / 2, mid = h / 2;
      for (let x = 0; x < w; x++) {
        const i = Math.min(cols - 1, Math.floor(x / w * cols)), a = pk[i * 2], b = pk[i * 2 + 1];
        g.fillRect(x, mid - b * mid * 1.9, 1, Math.max(1, (b - a) * mid * 1.9));
      }
      return c;
    };
    const acc = getComputedStyle(this.root).getPropertyValue('--acc').trim() || '#ffb547';
    this.cache = { dim: mk('rgba(200,204,214,.42)'), lit: mk(acc), w, h };
    // 小節線
    if (d.meta && d.meta.bpm) {
      const g = this.cache.dim.getContext('2d'), sr = d.ctx.sampleRate, bar = 4 * 60 / d.meta.bpm * sr, off = (d.meta.offset || 0) * sr;
      g.fillStyle = 'rgba(255,255,255,.16)';
      for (let p = off; p < d.N; p += bar) g.fillRect(Math.round(p / d.N * w), h - 5 * dpr, Math.max(1, dpr), 5 * dpr);
    }
  }

  frame() {
    const d = this.deck; this.scratchTick && this.scratchTick();
    if (!d.loaded) { this._set('vu0', 0, () => this.el.vu.style.height = '0%'); return; }
    const pos = d.getPosSec(), dur = d.duration();
    this.el.disc.style.transform = 'rotate(' + ((pos / 1.8 * 360) % 360).toFixed(2) + 'deg)';
    this._set('tel', fmtTime(pos), v => this.el.tel.textContent = v);
    this._set('trm', '-' + fmtTime((dur - pos) / Math.max(.5, d.tempoRatio)), v => this.el.trm.textContent = v);

    const bs = d.beatState();
    if (bs) {
      const on = d.playing ? bs.n : -1, flash = bs.phase < 0.18;
      this._set('led', on + ':' + flash, () => $$('i', this.el.leds).forEach((el, i) => { el.classList.toggle('on', i === on); el.classList.toggle('dn', i === on && bs.n === 0 && flash); }));
    }
    const lv = clamp(d.level() * 1.4, 0, 1);
    this.vuSm = Math.max(lv, (this.vuSm || 0) - 0.04);
    this.el.vu.style.height = (this.vuSm * 100).toFixed(0) + '%';

    // 波形
    const dpr = Math.min(2, window.devicePixelRatio || 1), cw = this.el.wave.clientWidth, ch = this.el.wave.clientHeight;
    if (!cw) return;
    const W = Math.floor(cw * dpr), H = Math.floor(ch * dpr);
    if (this.canvas.width !== W || this.canvas.height !== H) { this.canvas.width = W; this.canvas.height = H; this.cacheKey = ''; }
    if (this.cacheKey !== W + 'x' + H + ':' + (d.meta && d.meta.id)) { this._buildCache(W, H, dpr); this.cacheKey = W + 'x' + H + ':' + (d.meta && d.meta.id); }
    if (!this.cache) return;
    const g = this.g, x = Math.round(pos / dur * W);
    g.clearRect(0, 0, W, H); g.drawImage(this.cache.dim, 0, 0);
    if (x > 0) g.drawImage(this.cache.lit, 0, 0, x, H, 0, 0, x, H);
    const lp = d.rep.loop;
    if (lp.on) { g.fillStyle = 'rgba(125,220,152,.28)'; g.fillRect(lp.a / d.N * W, 0, (lp.b - lp.a) / d.N * W, H); }
    g.fillStyle = '#7ddc98'; g.fillRect(Math.round(d.cue / d.N * W), 0, Math.max(1, dpr), H);
    g.fillStyle = '#fff'; g.fillRect(x - dpr, 0, 2 * dpr, H);
  }
}

/* ---------- Crossfader ---------- */
class CrossfaderUI {
  constructor(app) {
    this.app = app; this.el = $('#xf'); this.fader = bindFader(this.el, {
      vertical: false,
      set: (v) => {
        if (this.app.automix.running) { this.app.automix.stop(); toast('手動推 Crossfader,Automix 已停止'); }
        let p = v * 2 - 1; if (Math.abs(p) < 0.04) p = 0;
        this.app.engine.setCrossfader(p);
      },
      onDouble: () => { this.app.engine.setCrossfader(0); this.fader.place(0.5); },
    });
    this.fader.place(0.5 + this.app.engine.xfPos / 2);
  }
  frame() {
    const am = this.app.automix, p = am.crossfaderPos();
    this.el.classList.toggle('auto', am.running && am.phase === 'transition');
    if (this.fader.dragging) return;
    const pos = p == null ? this.app.engine.xfPos : p;
    this.fader.place(0.5 + pos / 2);
  }
}

/* ---------- 歌單 + Automix ---------- */
class LibraryUI {
  constructor(app, root) {
    this.app = app; this.root = root; this.expanded = null;
    root.addEventListener('click', (e) => this.onClick(e));
    root.addEventListener('change', (e) => this.onChange(e));
    app.automix.onchange = () => { this.renderAutomixStatus(); };
    this.render();
  }
  metaOf(id) { return this.app.library.find(t => t.id === id); }

  render() {
    const app = this.app, am = app.automix, lib = app.library;
    const q = app.queue.map(id => this.metaOf(id)).filter(Boolean);
    let qhtml = '';
    if (!q.length) qhtml = '<div class="empty">佇列是空的。到下方曲庫按「＋」加入,或按「全部加入」。</div>';
    else qhtml = '<div class="list">' + q.map((t, i) => {
      let c = '';
      if (i > 0) {
        const s = compatibilityScore(q[i - 1].key, t.key), m = matchTempoRatio(t.bpm || 1, q[i - 1].bpm || 1, 0.16);
        const cls = s <= 1 ? 'good' : s === 2 ? 'mid' : 'bad', lab = s === 0 ? '同調' : s === 1 ? '相容' : s === 2 ? '可接' : s === 99 ? '未分析' : '調性衝突';
        c = '<div class="compat ' + cls + '">↓ ' + lab + (m.exact ? '' : ' · BPM 差太多') + '</div>';
      }
      return c + '<div class="row"><div class="num">' + (i + 1) + '</div><div class="kb" style="background:' + keyColor(t.key) + '">' + esc(t.key || '–') + '</div>' +
        '<div class="meta"><b>' + esc(t.title) + '</b><span>' + (t.bpm ? t.bpm.toFixed(0) + ' BPM' : '未分析') + ' · ' + fmtTime(t.duration) + '</span></div>' +
        '<div class="go"><button data-act="qup" data-id="' + t.id + '">↑</button><button data-act="qdown" data-id="' + t.id + '">↓</button><button data-act="qdel" data-id="' + t.id + '">×</button></div></div>';
    }).join('') + '</div>';

    let lhtml = '';
    if (!lib.length) lhtml = '<div class="empty">曲庫是空的。匯入你的音檔,或先產生示範曲試玩。</div>';
    else lhtml = '<div class="list">' + lib.map(t => {
      const inQ = app.queue.indexOf(t.id) >= 0, open = this.expanded === t.id;
      return '<div class="row"><div class="kb" style="background:' + keyColor(t.key) + '">' + esc(t.key || '–') + '</div>' +
        '<div class="meta"><b>' + esc(t.title) + '</b><span>' + (t.bpm ? t.bpm.toFixed(1).replace(/\.0$/, '') + ' BPM' : '未分析') + ' · ' + fmtTime(t.duration) + (t.artist ? ' · ' + esc(t.artist) : '') + '</span></div>' +
        '<div class="go"><button class="a" data-act="load" data-d="A" data-id="' + t.id + '">A</button><button class="b" data-act="load" data-d="B" data-id="' + t.id + '">B</button>' +
        '<button class="' + (inQ ? 'on' : '') + '" data-act="queue" data-id="' + t.id + '">' + (inQ ? '✓' : '＋') + '</button><button data-act="more" data-id="' + t.id + '">⋯</button></div></div>' +
        (open ? '<div class="row" style="justify-content:flex-end"><button class="abtn" data-act="edit" data-id="' + t.id + '">修正 BPM / 調性</button><button class="abtn stop" data-act="del" data-id="' + t.id + '">刪除</button></div>' : '');
    }).join('') + '</div>';

    const sc0 = $('.scroll', this.root), st = sc0 ? sc0.scrollTop : 0;
    this._amKey = null;
    this.root.innerHTML = '<div class="scroll">' +
      '<div class="card"><h3>Automix</h3>' +
      '<p>依調性(Camelot)與 BPM 排好順序,自動對拍、Bass Swap、等功率漸變。</p><div id="amStatus"></div>' +
      '<div class="actions"><button class="abtn" data-act="sort">依調性與 BPM 排序</button><button class="abtn" data-act="qclear">清空佇列</button></div>' +
      '<div class="opts"><label>過渡長度 <select data-opt="beats"><option value="8">8 拍</option><option value="16">16 拍</option><option value="32">32 拍</option></select></label>' +
      '<label><input type="checkbox" data-opt="bassSwap"> Bass Swap</label><label><input type="checkbox" data-opt="wash"> 收尾低通</label></div>' +
      '<div style="margin-top:10px">' + qhtml + '</div></div>' +
      '<div class="card"><h3>曲庫 <span style="color:var(--dim);font-weight:400">' + lib.length + ' 首</span></h3>' +
      '<div class="actions"><button class="abtn primary" data-act="import">匯入音檔</button><button class="abtn" data-act="demo">產生示範曲</button><button class="abtn" data-act="qall">全部加入佇列</button></div>' +
      '<p class="hint">' + (Store.persistent ? '曲庫存在這台裝置的瀏覽器儲存空間,不會上傳到任何地方。' : '目前無法使用永久儲存(可能是無痕模式),關閉頁面後曲庫會消失。') + '</p>' +
      '<div style="margin-top:8px">' + lhtml + '</div></div></div>';
    const sel = $('[data-opt=beats]', this.root); if (sel) sel.value = String(am.opts.beats);
    const bs = $('[data-opt=bassSwap]', this.root); if (bs) bs.checked = am.opts.bassSwap;
    const wa = $('[data-opt=wash]', this.root); if (wa) wa.checked = am.opts.wash;
    this.renderAutomixStatus();
    const sc1 = $('.scroll', this.root); if (sc1) sc1.scrollTop = st;
  }

  renderAutomixStatus() {
    const box = $('#amStatus', this.root); if (!box) return;
    const am = this.app.automix, cur = am.current, nxt = am.nextMeta;
    // 結構只在「狀態種類/曲目」改變時重建;進度文字用 textContent 更新,避免按鈕在點擊途中被換掉
    const key = am.running ? 'run:' + (cur && cur.id) + ':' + (nxt && nxt.id) : 'idle:' + this.app.queue.length;
    if (key !== this._amKey) {
      this._amKey = key;
      if (!am.running) {
        const n = this.app.queue.length;
        box.innerHTML = '<div class="actions"><button class="abtn go" data-act="amstart"' + (n ? '' : ' disabled') + '>開始 Automix(' + n + ' 首)</button></div>';
      } else {
        box.innerHTML = '<div class="now"><span class="dot"></span><div style="min-width:0"><b>' + esc(cur ? cur.title : '') + '</b>' +
          '<div style="color:var(--dim);font-size:12px"><span id="amText"></span>' + (nxt ? ' · 下一首:' + esc(nxt.title) : '') + '</div></div></div>' +
          '<div class="actions"><button class="abtn" data-act="amskip">下一首</button><button class="abtn stop" data-act="amstop">停止 Automix</button></div>';
      }
    }
    const t = $('#amText', box); if (t) t.textContent = am.statusText();
  }

  onChange(e) {
    const o = e.target.dataset.opt, am = this.app.automix; if (!o) return;
    if (o === 'beats') am.opts.beats = parseInt(e.target.value, 10); else am.opts[o] = e.target.checked;
    this.app.saveSettings();
  }

  async onClick(e) {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, app = this.app;
    try {
      if (act === 'import') $('#fileInput').click();
      else if (act === 'demo') await app.addDemos(b);
      else if (act === 'load') await app.loadToDeckUser(b.dataset.d, this.metaOf(id));
      else if (act === 'queue') { const i = app.queue.indexOf(id); if (i >= 0) app.queue.splice(i, 1); else app.queue.push(id); this.render(); }
      else if (act === 'qall') { app.queue = app.library.map(t => t.id); this.render(); }
      else if (act === 'qclear') { app.queue = []; this.render(); }
      else if (act === 'qdel') { app.queue = app.queue.filter(x => x !== id); this.render(); }
      else if (act === 'qup' || act === 'qdown') {
        const i = app.queue.indexOf(id), j = act === 'qup' ? i - 1 : i + 1;
        if (i >= 0 && j >= 0 && j < app.queue.length) { [app.queue[i], app.queue[j]] = [app.queue[j], app.queue[i]]; this.render(); }
      }
      else if (act === 'sort') {
        const items = (app.queue.length ? app.queue : app.library.map(t => t.id)).map(x => this.metaOf(x)).filter(Boolean);
        app.queue = sortByHarmony(items).map(t => t.id); this.render(); toast('已依調性與 BPM 排序');
      }
      else if (act === 'more') { this.expanded = this.expanded === id ? null : id; this.render(); }
      else if (act === 'edit') await app.editMeta(id);
      else if (act === 'del') { await app.deleteTrack(id); this.expanded = null; }
      else if (act === 'amstart') await app.startAutomix();
      else if (act === 'amstop') { app.automix.stop(); this.render(); }
      else if (act === 'amskip') app.automix.skip();
    } catch (err) { toast('發生錯誤:' + (err && err.message || err), 4000); console.error(err); }
  }
}

  }
}

/* ============================================================================
 * App:把 Store / Engine / Automix / UI 串在一起
 * ========================================================================== */
const App = {
  engine: new Engine(), library: [], queue: [], settings: {}, decksUI: {}, providers: {},
  tab: 'mixer', toast,

  async init() {
    try { this.settings = JSON.parse(localStorage.getItem('djm_settings') || '{}'); } catch (e) { this.settings = {}; }
    this.providers = { local: new LocalFileProvider(), url: new UrlProvider(), dropbox: new DropboxProvider() };
    await Store.open();
    this.library = (await Store.listMeta()).sort((a, b) => a.added - b.added);
    this.automix = new Automix(this);
    Object.assign(this.automix.opts, { beats: this.settings.beats || 16, bassSwap: this.settings.bassSwap !== false, wash: this.settings.wash !== false });

    this.libraryUI = new LibraryUI(this, $('#tab-library'));
    this.sourcesUI = new SourcesUI(this, $('#tab-sources'));
    $$('.tabs button').forEach(b => b.addEventListener('click', () => this.showTab(b.dataset.tab)));
    $('#startBtn').addEventListener('click', () => this.start());
    $('#fileInput').addEventListener('change', (e) => { const f = e.target.files; if (f && f.length) this.importFiles(f); e.target.value = ''; });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => { if (!e.target.closest || !e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
    document.addEventListener('pointerdown', () => this.engine.resume(), { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.engine.resume(); });

    try { if (await this.providers.dropbox.finishOAuth()) { toast('Dropbox 已連線'); this.showTab('sources'); } } catch (e) { toast(e.message); }
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    requestAnimationFrame(this._loop);
  },

  workletURL() { return URL.createObjectURL(new Blob([$('#worklet-src').textContent], { type: 'text/javascript' })); },

  async start() {
    const btn = $('#startBtn'), msg = $('#startMsg'); btn.disabled = true; msg.textContent = '';
    try { await this.engine.init(this.workletURL()); }
    catch (e) { msg.textContent = '無法啟動音訊引擎:' + (e && e.message || e); btn.disabled = false; console.error(e); return; }
    this.engine.decks.A.setTempoRange(this.settings.range || 0.16); this.engine.decks.B.setTempoRange(this.settings.range || 0.16);
    this.decksUI.A = new DeckUI(this, this.engine.decks.A, $('#deckA'));
    this.decksUI.B = new DeckUI(this, this.engine.decks.B, $('#deckB'));
    this.xfUI = new CrossfaderUI(this);
    this.sourcesUI.render();
    $('#start').classList.add('hide');
    if (!this.library.length) toast('到「歌單」按「產生示範曲」就能立刻試玩', 4200);
  },

  showTab(t) {
    this.tab = t;
    $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $$('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
    if (t === 'library') this.libraryUI.render();
    if (t === 'sources') this.sourcesUI.render();
  },

  /* ----- 曲庫 ----- */
  meta(id) { return this.library.find(t => t.id === id); },
  refreshLibrary() { this.libraryUI.render(); },

  async importBlobs(items) {
    let ok = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      toast('分析中 (' + (i + 1) + '/' + items.length + '):' + it.title, 60000);
      try {
        const meta = await Importer.importBlob(this.engine, it.blob, it);
        this.library.push(meta); ok++;
      } catch (e) { toast('無法讀取「' + it.title + '」:' + (e && e.message || '不支援的格式'), 4500); await new Promise(r => setTimeout(r, 1200)); }
    }
    this.refreshLibrary();
    if (ok) toast('已加入 ' + ok + ' 首到曲庫');
    return ok;
  },
  async importFiles(files) { await this.importBlobs(this.providers.local.items(files)); },

  async addDemos() {
    if (!this.engine.ready) return toast('請先按「開始混音」');
    const have = new Set(this.library.map(t => t.title)), items = [];
    for (let i = 0; i < DEMO_TRACKS.length; i++) {
      const d = DEMO_TRACKS[i]; if (have.has(d.title)) continue;
      toast('合成示範曲 (' + (i + 1) + '/' + DEMO_TRACKS.length + ')…', 60000);
      await new Promise(r => setTimeout(r, 30));
      const x = synthDemoTrack({ bpm: d.bpm, root: d.root, minor: d.minor, bars: 24, sr: 32000, seed: d.seed });
      items.push({ title: d.title, artist: d.artist, source: 'demo', blob: new Blob([encodeWav16(x, 32000)], { type: 'audio/wav' }) });
    }
    if (items.length) await this.importBlobs(items);
    this.queue = sortByHarmony(this.library.filter(t => t.source === 'demo')).map(t => t.id);
    this.refreshLibrary();
    toast('示範曲已依調性排好,可以開始 Automix 了');
  },

  async addFromUrl(url) {
    toast('下載中…', 60000);
    const blob = await this.providers.url.fetchBlob(url, (p) => toast('下載中 ' + Math.round(p * 100) + '%', 60000));
    await this.importBlobs([{ title: this.providers.url.titleFromUrl(url), blob, source: 'url' }]);
  },
  async addFromDropbox(entry) {
    toast('從 Dropbox 下載:' + entry.name, 60000);
    const blob = await this.providers.dropbox.fetchBlob(entry);
    await this.importBlobs([{ title: titleFromName(entry.name), blob, source: 'dropbox' }]);
  },

  async editMeta(id) {
    const t = this.meta(id); if (!t) return;
    const bpm = prompt('BPM(60–200)', t.bpm ? t.bpm.toFixed(1) : '');
    if (bpm === null) return;
    const key = prompt('調性(Camelot,例如 8A、9B)', t.key || '');
    if (key === null) return;
    const b = parseFloat(bpm), k = key.trim().toUpperCase();
    if (bpm.trim() && (!(b >= 60 && b <= 200))) return toast('BPM 需要在 60 到 200 之間');
    if (k && !/^(1[0-2]|[1-9])[AB]$/.test(k)) return toast('調性格式像 8A 或 9B');
    if (bpm.trim()) t.bpm = b; if (k) t.key = k;
    await Store.putMeta(t);
    for (const d of Object.values(this.engine.decks)) if (d.meta && d.meta.id === t.id) d._emit('load');
    this.refreshLibrary(); toast('已更新');
  },

  async deleteTrack(id) {
    const t = this.meta(id); if (!t || !confirm('從曲庫刪除「' + t.title + '」?')) return;
    await Store.remove(id);
    this.library = this.library.filter(x => x.id !== id); this.queue = this.queue.filter(x => x !== id);
    this.refreshLibrary();
  },

  /* ----- 載入到 Deck ----- */
  async loadToDeck(id, meta) {
    const deck = this.engine.decks[id]; deck.loading = true; deck._emit('state');
    if (deck.playing) deck.pause();
    try {
      const blob = await Store.getBlob(meta.id);
      if (!blob) throw new Error('找不到音檔');
      const buf = await this.engine.decode(await blob.arrayBuffer());
      deck.loadAudio(buf, meta);
    } finally { deck.loading = false; deck._emit('state'); }
  },
  async loadToDeckUser(id, meta) {
    if (!meta) return;
    if (this.automix.running) return toast('Automix 進行中,請先停止再手動載入');
    toast('載入到 Deck ' + id + '…', 30000);
    await this.loadToDeck(id, meta);
    toast('Deck ' + id + ':' + meta.title); this.showTab('mixer');
  },

  async startAutomix() {
    const items = this.queue.map(id => this.meta(id)).filter(Boolean);
    if (!items.length) return toast('佇列是空的');
    this.showTab('mixer');
    toast('Automix 啟動', 2000);
    await this.automix.start(items);
    this.libraryUI.render();
  },

  setTempoRange(r) { this.settings.range = r; this.saveSettings(); for (const d of Object.values(this.engine.decks)) d.setTempoRange(r); },
  saveSettings() {
    const o = this.automix.opts;
    Object.assign(this.settings, { beats: o.beats, bassSwap: o.bassSwap, wash: o.wash });
    try { localStorage.setItem('djm_settings', JSON.stringify(this.settings)); } catch (e) {}
  },

  /* ----- 畫面更新迴圈 ----- */
  _loop() {
    const a = App;
    if (a.engine.ready && !document.hidden) {
      if (a.tab === 'mixer' && a.decksUI.A) { a.decksUI.A.frame(); a.decksUI.B.frame(); a.xfUI.frame(); }
      a._chip();
    }
    requestAnimationFrame(a._loop);
  },
  _chip() {
    const chip = $('#chip'), am = this.automix; let txt, cls = '';
    if (this.engine.ctx.state !== 'running') { txt = '音訊已暫停 · 點一下繼續'; cls = 'bad'; }
    else if (am.running) { txt = 'Automix · ' + am.statusText(); cls = 'live'; }
    else txt = 'Automix 關閉';
    if (chip.textContent !== txt) chip.textContent = txt;
    chip.className = 'chip ' + cls;
  },
};

window.__app = App;
window.addEventListener('DOMContentLoaded', () => App.init());

</script>
</body>
</html>
