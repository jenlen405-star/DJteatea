<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DJ Mixer">
<meta name="theme-color" content="#24262c">
<meta name="format-detection" content="telephone=no">
<title>DJ Mixer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --chassis: #24262c; --panel: #2d3038; --panel-hi: #353944; --well: #1a1b20; --edge: #454a56;
  --ink: #ece8df; --dim: #9a9ca6; --faint: #6b6e79;
  --amber: #ffb547; --cyan: #4cc9f0; --danger: #ff6a5c; --good: #7ddc98;
  --num: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --ui: -apple-system, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--chassis); color: var(--ink); font: 13px/1.35 var(--ui);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc, var(--amber)); outline-offset: 2px; }
input, select { font: inherit; }

#app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

/* ---------- 頂欄 ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px 2px; min-height: 40px; }
.brand { font: 700 18px/1 var(--num); letter-spacing: .01em; font-style: italic; margin-right: 0; white-space: nowrap; flex: 0 0 auto; }
.tabs { display: flex; background: var(--well); border-radius: 9px; padding: 2px; flex: 0 0 auto; }
.tabs button { white-space: nowrap; padding: 5px 10px; border-radius: 7px; color: var(--dim); font-weight: 600; }
.tabs button.on { background: var(--panel-hi); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
.chip { margin-left: auto; flex: 1 1 0; min-width: 0; text-align: right; font-size: 12px; color: var(--dim); background: var(--well); padding: 5px 10px; border-radius: 99px; max-width: 46%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.live { color: var(--good); }
.chip.bad { color: var(--danger); }

.tab { display: none; flex: 1; min-height: 0; }
.tab.on { display: flex; }

/* ---------- 混音台 ---------- */
.mixer { flex: 1; min-height: 0; min-width: 0; display: grid; gap: 6px; padding: 4px 8px 8px;
  grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "a b" "x x"; }
@media (orientation: portrait) {
  .mixer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "a" "x" "b"; }
}
#deckA { grid-area: a; } #deckB { grid-area: b; }

.deck { --acc: var(--amber); background: var(--panel); border-radius: 14px; padding: 8px; display: grid; gap: 6px; min-height: 0; min-width: 0;
  box-shadow: inset 0 0 0 1px var(--edge), inset 0 3px 0 var(--acc);
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: "info info info info" "wave wave wave wave" "tempo plat vol ctl" "loop loop loop loop" "fx fx fx fx"; }
.deck.b { --acc: var(--cyan); }

.info { grid-area: info; display: flex; align-items: center; gap: 8px; min-width: 0; padding-top: 3px; }
.trk { flex: 1; min-width: 0; }
.trk .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk .s { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key { font: 700 13px var(--num); min-width: 34px; text-align: center; padding: 2px 6px; border-radius: 6px; background: var(--well); color: var(--dim); }
.bpm { text-align: right; line-height: 1; }
.bpm b { display: block; font: 600 26px var(--num); font-variant-numeric: tabular-nums; color: var(--acc); }
.bpm i { font: normal 600 11px var(--num); color: var(--dim); font-variant-numeric: tabular-nums; }

.wave { grid-area: wave; position: relative; height: 34px; background: var(--well); border-radius: 7px; overflow: hidden; touch-action: none; }
.wave canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.wave .tm { position: absolute; right: 5px; top: 1px; font: 600 11px var(--num); color: var(--ink); font-variant-numeric: tabular-nums; text-shadow: 0 0 3px #000; pointer-events: none; }
.wave .tm.l { left: 5px; right: auto; color: var(--dim); }

/* 轉盤 */
.platcell { grid-area: plat; position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.platter { width: var(--p, 120px); height: var(--p, 120px); border-radius: 50%; position: relative; touch-action: none; cursor: grab;
  background: #0c0c0e; box-shadow: 0 0 0 3px var(--well), 0 0 0 4px var(--edge), 0 6px 14px rgba(0,0,0,.45); }
.platter:active { cursor: grabbing; }
.disc { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; will-change: transform;
  background:
    conic-gradient(from 20deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.11) 14deg, rgba(255,255,255,0) 34deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,.08) 194deg, rgba(255,255,255,0) 214deg),
    repeating-radial-gradient(circle at 50% 50%, #0d0d0f 0 1.5px, #19191d 1.5px 3px); }
.disc .lab { position: absolute; top: 33%; left: 33%; right: 33%; bottom: 33%; border-radius: 50%; background: var(--acc); }
.disc .lab::before { content: ""; position: absolute; top: 6%; left: 50%; width: 3px; height: 26%; margin-left: -1.5px; background: rgba(0,0,0,.55); border-radius: 2px; }
.disc .lab::after { content: ""; position: absolute; top: 50%; left: 50%; width: 9%; height: 9%; margin: -4.5% 0 0 -4.5%; background: #0c0c0e; border-radius: 50%; }
.platter.touch { box-shadow: 0 0 0 3px var(--acc), 0 0 16px var(--acc); }
.leds { position: absolute; left: 0; right: 0; bottom: -3px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.leds i { width: 7px; height: 7px; border-radius: 50%; background: #111; box-shadow: 0 0 0 1px var(--edge); }
.leds i.on { background: var(--acc); box-shadow: 0 0 6px var(--acc); }
.leds i.on.dn { background: #fff; }
.nofile { position: absolute; color: var(--faint); font-size: 12px; pointer-events: none; text-align: center; }

/* 推桿 */
.fader { position: relative; width: 32px; height: 100%; min-height: 60px; touch-action: none; cursor: ns-resize; }
.fader .rail { position: absolute; left: 50%; width: 6px; margin-left: -3px; top: 10px; bottom: 10px; background: var(--well); border-radius: 3px; box-shadow: inset 0 0 0 1px #000; }
.fader .ticks { position: absolute; left: 2px; width: 6px; top: 10px; bottom: 10px;
  background: repeating-linear-gradient(to bottom, var(--faint) 0 1px, transparent 1px 10%); opacity: .7; }
.fader .mid { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--acc); opacity: .55; }
.fader .cap { position: absolute; left: 1px; right: 1px; height: 24px; margin-top: -12px; border-radius: 5px;
  background: linear-gradient(#e4e6ec, #a2a8b5 55%, #8b91a0); box-shadow: 0 2px 4px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4); }
.fader .cap::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; margin-top: -1px; background: var(--acc); border-radius: 1px; }
.fader .meter { position: absolute; right: 0; width: 4px; top: 10px; bottom: 10px; background: var(--well); border-radius: 2px; overflow: hidden; }
.fader .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(to top, var(--good) 0 60%, var(--amber) 60% 85%, var(--danger) 85%); }
.fader .lbl { position: absolute; left: 0; right: 0; top: -1px; text-align: center; font: 600 10px var(--num); color: var(--dim); pointer-events: none; }
.fader.tempo { grid-area: tempo; } .fader.vol { grid-area: vol; }

/* 按鈕 */
.ctl { grid-area: ctl; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 5px; width: 104px; }
.btn { background: var(--panel-hi); border-radius: 9px; font-weight: 700; color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 0 0 1px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; min-height: 34px; }
.btn:active { transform: translateY(1px); filter: brightness(1.15); }
.btn.on { background: var(--acc); color: #17181c; }
.btn.play { font-size: 18px; }
.btn.dis { opacity: .4; }
.pads { display: flex; gap: 4px; min-width: 0; }
.pads .btn { flex: 1; min-width: 0; min-height: 28px; font-size: 12px; padding: 0 2px; font-weight: 600; border-radius: 7px; }
.pads .btn.lp { flex: 0 0 auto; padding: 0 9px; }
.pads .sz { flex: 0 0 auto; width: 30px; background: var(--well); color: var(--dim); }
.pads .sz.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--acc); }
.row-loop { grid-area: loop; } .row-fx { grid-area: fx; }
.bankbtn { display: none; flex: 0 0 auto; width: 38px; background: var(--well); color: var(--dim); }

/* 橫向:空間不足,Loop 與 FX 共用一列,用按鈕切換 */
@media (orientation: landscape) {
  .deck { grid-template-areas: "info info info info" "wave wave wave wave" "tempo plat vol ctl" "pads pads pads pads"; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .row-loop, .row-fx { grid-area: pads; }
  .deck.bank-loop .row-fx, .deck.bank-fx .row-loop { display: none; }
  .bankbtn { display: flex; }
  .wave { height: 28px; }
  .bpm b { font-size: 22px; }
}

/* Crossfader */
.xwrap { grid-area: x; display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 6px 14px;
  box-shadow: inset 0 0 0 1px var(--edge); }
.xwrap .ab { font: 700 18px var(--num); width: 16px; text-align: center; }
.xwrap .ab.a { color: var(--amber); } .xwrap .ab.b { color: var(--cyan); }
.xf { position: relative; flex: 1; height: 44px; touch-action: none; cursor: ew-resize; }
.xf .rail { position: absolute; top: 50%; left: 24px; right: 24px; height: 6px; margin-top: -3px; background: var(--well); border-radius: 3px; box-shadow: inset 0 0 0 1px #000; }
.xf .ticks { position: absolute; left: 24px; right: 24px; top: 7px; height: 6px; background: repeating-linear-gradient(to right, var(--faint) 0 1px, transparent 1px 12.5%); opacity: .7; }
.xf .cap { position: absolute; top: 50%; width: 46px; height: 32px; margin: -16px 0 0 -23px; border-radius: 6px;
  background: linear-gradient(#e4e6ec, #a2a8b5 55%, #8b91a0); box-shadow: 0 2px 5px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4); }
.xf .cap::after { content: ""; position: absolute; top: 5px; bottom: 5px; left: 50%; width: 2px; margin-left: -1px; background: #17181c; }
.xf.auto .cap { box-shadow: 0 0 0 2px var(--good), 0 2px 5px rgba(0,0,0,.5); }

/* ---------- 歌單 / 音源 ---------- */
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 10px 18px; user-select: text; -webkit-user-select: text; }
.card { background: var(--panel); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: inset 0 0 0 1px var(--edge); }
.card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.card p { margin: 6px 0; color: var(--dim); }
.card .hint { font-size: 12px; color: var(--faint); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px; }
.abtn { background: var(--panel-hi); border-radius: 9px; padding: 9px 13px; font-weight: 600; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.07) inset; }
.abtn.primary { background: var(--amber); color: #17181c; }
.abtn.go { background: var(--good); color: #17181c; }
.abtn.stop { background: var(--danger); color: #17181c; }
.abtn:disabled { opacity: .45; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; color: var(--dim); }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
select, input[type=text], input[type=url], input[type=password] { background: var(--well); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; user-select: text; -webkit-user-select: text; }
input.wide { width: 100%; margin: 4px 0; }

.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; background: var(--well); border-radius: 10px; padding: 8px 8px 8px 10px; }
.row .kb { flex: 0 0 auto; width: 40px; text-align: center; font: 700 13px var(--num); padding: 3px 0; border-radius: 6px; color: #17181c; background: var(--faint); }
.row .meta { flex: 1; min-width: 0; }
.row .meta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta span { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .go { display: flex; gap: 4px; }
.row .go button { min-width: 34px; height: 34px; border-radius: 8px; background: var(--panel-hi); font-weight: 700; }
.row .go button.a { color: var(--amber); } .row .go button.b { color: var(--cyan); }
.row .go button.on { background: var(--good); color: #17181c; }
.row .num { flex: 0 0 auto; width: 22px; text-align: center; color: var(--faint); font: 600 14px var(--num); }
.compat { text-align: center; font-size: 11px; color: var(--faint); margin: -2px 0; }
.compat.good { color: var(--good); } .compat.mid { color: var(--amber); } .compat.bad { color: var(--danger); }
.empty { color: var(--dim); padding: 14px 4px; text-align: center; }
.now { display: flex; gap: 10px; align-items: center; margin: 8px 0; padding: 8px 10px; background: var(--well); border-radius: 10px; }
.now .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); flex: 0 0 auto; }
.bar { height: 5px; background: var(--well); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--acc, var(--good)); width: 0; }

/* ---------- 覆蓋層 / Toast ---------- */
#start { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--chassis); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 16px; }
#start.hide { display: none; }
#start .spin { width: 128px; height: 128px; border-radius: 50%; position: relative;
  background: conic-gradient(from 20deg, rgba(255,255,255,0), rgba(255,255,255,.12) 14deg, rgba(255,255,255,0) 34deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,.08) 194deg, rgba(255,255,255,0) 214deg),
              repeating-radial-gradient(circle, #0d0d0f 0 1.5px, #19191d 1.5px 3px);
  box-shadow: 0 0 0 4px var(--well), 0 8px 22px rgba(0,0,0,.5); animation: spin 5.4s linear infinite; }
#start .spin::after { content: ""; position: absolute; top: 33%; left: 33%; right: 33%; bottom: 33%; border-radius: 50%;
  background: conic-gradient(var(--amber) 0 50%, var(--cyan) 50% 100%); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #start .spin { animation: none; } }
#start h1 { margin: 0; font: italic 700 36px var(--num); }
#start p { margin: 0; color: var(--dim); max-width: 30em; }
#start .err { color: var(--danger); }
#start .abtn { font-size: 17px; padding: 13px 34px; }

#toast { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 60;
  background: #0d0e11; color: var(--ink); padding: 9px 15px; border-radius: 99px; box-shadow: 0 0 0 1px var(--edge), 0 6px 18px rgba(0,0,0,.5);
  max-width: 88vw; text-align: center; pointer-events: none; transition: opacity .18s, transform .18s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">DJ Mixer</div>
    <nav class="tabs"><button class="on" data-tab="mixer">混音台</button><button data-tab="library">歌單</button><button data-tab="sources">音源</button></nav>
    <div class="chip" id="chip">Automix 關閉</div>
  </header>
  <main style="display:flex;flex:1;min-height:0;min-width:0">
    <section class="tab on" id="tab-mixer">
      <div class="mixer">
        <div class="deck a" id="deckA"></div>
        <div class="xwrap"><span class="ab a">A</span>
          <div class="xf" id="xf"><div class="rail"></div><div class="ticks"></div><div class="cap"></div></div>
          <span class="ab b">B</span></div>
        <div class="deck b" id="deckB"></div>
      </div>
    </section>
    <section class="tab" id="tab-library"></section>
    <section class="tab" id="tab-sources"></section>
  </main>
</div>

<div id="start">
  <div class="spin"></div>
  <h1>DJ Mixer</h1>
  <p>兩個轉盤、變速不變調、刷碟、Loop、效果器,還有會自己對拍換歌的 Automix。</p>
  <button class="abtn primary" id="startBtn">開始混音</button>
  <p class="err" id="startMsg"></p>
  <p style="font-size:12px;color:var(--faint)">先把音量調好或戴上耳機。橫向握持轉盤會更大。</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.aif,.aiff" multiple hidden>

<script type="text/plain" id="worklet-src">
/* ============================================================================
 * DeckCore — 單一轉盤的音訊 DSP 核心(純 JS,不依賴任何瀏覽器 API)
 *
 * 兩種播放模式:
 *  1. stretch(變速不變調):WSOLA 時間伸縮。輸入以 tempo 倍速前進,
 *     但每個 grain 都以原音高讀取,並用互相關搜尋最佳銜接點,所以音高不變。
 *  2. resample(黑膠/刷碟):直接以任意速率(含負值=倒轉)對取樣點做內插。
 *     刷碟、放開後的慣性回彈、Key Lock 關閉時都走這條路。
 *
 * 模式切換(刷碟 ↔ 正常播放)由 render() 依狀態自動處理:
 *  - 手指按著轉盤(scratchActive) → resample,速率追隨手指
 *  - 放開後 curRate 以 tau 時間常數平滑回到 tempo,收斂後自動切回 stretch
 * ========================================================================== */
class DeckCore {
  constructor(sr) {
    this.sr = sr;
    this.L = null; this.R = null; this.N = 0;

    // 播放狀態
    this.pos = 0;              // resample 模式的播放頭(來源取樣點,浮點)
    this.playing = false;
    this.tempo = 1;            // 目標速度倍率(1 = 原速)
    this.keylock = true;       // true: 變速不變調;false: 黑膠模式(音高跟著變)
    this.scratchActive = false;
    this.scratchRate = 0;
    this.curRate = 0;          // 平滑後的實際速率(來源取樣點 / 輸出取樣點)
    this.tau = 0.02;           // 速率平滑時間常數(秒)
    this.mode = 'resample';
    this.loop = { on: false, a: 0, b: 0 };
    this.fade = 1;             // 0..1 的淡入增益(切換模式/seek 時避免爆音)
    this.fadeStep = 1 / 96;
    this.ended = false;

    // WSOLA 參數
    this.W = 2048;             // grain 長度
    this.H = 1024;             // 輸出 hop(50% 重疊)
    this.tol = 512;            // 搜尋最佳銜接點的範圍(±取樣點)
    this.win = new Float32Array(this.W);
    for (let i = 0; i < this.W; i++) {
      this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / this.W); // periodic Hann,50% 重疊總和為 1
    }
    const segLen = this.W + 2 * this.tol;
    this.segL = new Float32Array(segLen);
    this.segR = new Float32Array(segLen);
    this.segM = new Float32Array(segLen);
    this.accL = new Float32Array(this.W);
    this.accR = new Float32Array(this.W);
    this.qL = new Float32Array(this.H);
    this.qR = new Float32Array(this.H);
    this.refM = new Float32Array(this.H);
    this.hasRef = false;
    this.qRead = this.H;       // = H 代表佇列已空,下次 render 會先產生一個 hop
    this.anaPos = 0;           // 下一個 grain 的名義分析位置
    this.hopSrcStart = 0;      // 目前 hop 對應的來源位置(用來回報播放頭)

      case 'unload':    c.unload(); this.report(); break;
      case 'play':      c.play(true); break;

      case 'pause':     c.pause(); this.pendingStart = null; break;
      case 'seek':      c.seek(m.pos); this.report(); break;
      case 'nudge':     c.nudge(m.delta); break;
      case 'tempo':     c.setTempo(m.v); break;
      case 'keylock':   c.setKeylock(m.on); break;

      case 'scratchRate':  c.setScratchRate(m.v); break;
      case 'scratchEnd':   c.scratchEnd(); break;

    const c = this.core;

      t: 'pos', pos: c.getPos(), frame: currentFrame,
      rate: c.mode === 'stretch' ? c.tempo : c.curRate,
      playing: c.playing, scratch: c.scratchActive,

    return [

      { name: 'down', defaultValue: 6, minValue: 1, maxValue: 64, automationRate: 'k-rate' },

const _fftCache = {};

    for (let i = 0; i < n; i++) { let r = 0; for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b); rev[i] = r; }

  const { rev, cos, sin } = c;
  for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }

      for (let j = 0, k = 0; j < half; j++, k += step) {

  r0 = r0 / n + 1e-12;
  for (let lag = 1; lag <= maxLag; lag++) {
    let s = 0; for (let i = 0; i + lag < n; i++) s += env[i] * env[i + lag];
    r[lag] = s / (n - lag) / r0;
  }
  r[0] = 1; return r;
}

function detectBeatGrid(x, sr, segStartSec) {
  const env = _onsetEnvelope(x, sr), n = env.length, fr = sr / _HOP;
  if (n < fr * 6) return null;
  const maxLagNeeded = Math.min(n - 2, Math.ceil(4 * fr * 60 / 65) + 2);
  const r = _autocorr(env, maxLagNeeded);
  const rAt = (lag) => { if (lag >= maxLagNeeded) return 0; const i = Math.floor(lag), f = lag - i; return Math.max(0, r[i] * (1 - f) + r[i + 1] * f); };

  // 1) 粗估:對 70~180 BPM 的每個候選,加總其整數倍週期的自相關(諧波加總),再乘上偏好 100~150 BPM 的先驗
  let bestBpm = 120, bestScore = -1;
  const w = [1, 0.75, 0.5, 0.35];
  for (let bpm = 70; bpm <= 180; bpm += 0.25) {
    const lag = 60 / bpm * fr;
    let s = 0; for (let m = 1; m <= 4; m++) s += w[m - 1] * rAt(lag * m);
    const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 125) / 0.5, 2));
    s *= (0.55 + 0.45 * prior);
    if (s > bestScore) { bestScore = s; bestBpm = bpm; }
  }

  // 2) 精修:在 ±3% 內以「梳狀濾波」同時搜尋 BPM 與相位(能量最大者)
  const env3 = new Float32Array(n);
  for (let i = 0; i < n; i++) env3[i] = 0.25 * (env[i - 1] || 0) + 0.5 * env[i] + 0.25 * (env[i + 1] || 0);
  let best = { s: -1, bpm: bestBpm, phase: 0 };
  for (let bpm = bestBpm * 0.97; bpm <= bestBpm * 1.03; bpm += 0.05) {
    const P = 60 / bpm * fr, pMax = Math.ceil(P);
    for (let ph = 0; ph < pMax; ph++) {
      let s = 0, k = 0;
      for (let t = ph; t < n - 1; t += P, k++) s += env3[Math.round(t)];
      s /= k;
      s *= 1 - 0.02 * Math.abs(bpm - bestBpm) / (bestBpm * 0.03);   // 稍微偏好粗估值
      if (s > best.s) best = { s, bpm, phase: ph };
    }
  }
  let bpm = best.bpm;
  const rounded = Math.round(bpm);
  if (Math.abs(bpm - rounded) < 0.07) bpm = rounded;   // 電子音樂多半是整數 BPM
  // 用最終 BPM 重新只搜尋相位
  const P = 60 / bpm * fr; let bp = { s: -1, ph: best.phase };
  for (let ph = 0; ph < Math.ceil(P); ph++) {
    let s = 0, k = 0; for (let t = ph; t < n - 1; t += P, k++) s += env3[Math.round(t)];
    s /= k; if (s > bp.s) bp = { s, ph };
  }
  const beat = 60 / bpm;
  const t0 = segStartSec + (bp.ph + 0.5) * _HOP / sr;
  const offset = ((t0 % beat) + beat) % beat;
  return { bpm, offset, confidence: best.s };
}

/* ---------- 調性 ---------- */
function detectKey(x, sr) {
  const d = Math.max(1, Math.round(sr / 11025)), srd = sr / d;
  const m = Math.floor(x.length / d), y = new Float32Array(m);
  for (let i = 0; i < m; i++) { let s = 0; for (let k = 0; k < d; k++) s += x[i * d + k]; y[i] = s / d; }
  const size = 4096, hop = 2048;
  const win = new Float64Array(size); for (let i = 0; i < size; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / size);
  const kMin = Math.ceil(110 * size / srd), kMax = Math.min(size / 2 - 1, Math.floor(1800 * size / srd));
  const binPc = new Int8Array(size / 2).fill(-1), binW = new Float64Array(size / 2);
  for (let k = kMin; k <= kMax; k++) {
    const f = k * srd / size, midi = 69 + 12 * Math.log2(f /440), r = Math.round(midi);
    if (Math.abs(midi - r) < 0.4) {                       // 只取靠近半音中心的頻點,減少相鄰音洩漏
      binPc[k] = ((r % 12) + 12) % 12;
      // 低頻加權:貝斯通常就是主音,能有效減少「五度混淆」(以 24 個調的合成曲實測 13/24 → 22/24)
      binW[k] = Math.pow(Math.min(1, 220 / f), 1.5);
    }
  }
  const chroma = new Float64Array(12), re = new Float64Array(size), im = new Float64Array(size);
  for (let s = 0; s + size <= m; s += hop) {
    for (let i = 0; i < size; i++) { re[i] = y[s + i] * win[i]; im[i] = 0; }
    fftInPlace(re, im);
    for (let k = kMin; k <= kMax; k++) { const pc = binPc[k]; if (pc >= 0) chroma[pc] += binW[k] * Math.pow(Math.hypot(re[k], im[k]), 0.75); }
  }
  let tot = 0; for (let i = 0; i < 12; i++) tot += chroma[i];
  if (tot <= 0) return null;
  for (let i = 0; i < 12; i++) chroma[i] /= tot;

  const corr = (prof, rot) => {
    let mc = 0, mp = 0; for (let i = 0; i < 12; i++) { mc += chroma[i]; mp += prof[i]; } mc /= 12; mp /= 12;
    let num = 0, dc = 0, dp = 0;
    for (let i = 0; i < 12; i++) { const a = chroma[i] - mc, b = prof[(i - rot + 12) % 12] - mp; num += a * b; dc += a * a; dp += b * b; }
    return num / Math.sqrt(dc * dp + 1e-12);
  };
  const scores = [];
  for (let root = 0; root < 12; root++) {
    scores.push({ s: corr(KK_MAJOR, root), code: CAMELOT_MAJOR[root] });
    scores.push({ s: corr(KK_MINOR, root), code: CAMELOT_MINOR[root] });
  }
  scores.sort((a, b) => b.s - a.s);
  return { key: scores[0].code, confidence: scores[0].s - scores[1].s };
}

/* ---------- 整合 ---------- */
function analyzeTrack(L, R, sr) {
  const N = L.length, dur = N / sr;
  // BPM:避開開頭 8 秒(常有無節奏的前奏),取最多 50 秒
  const bStart = Math.min(Math.floor(8 * sr), Math.floor(N * 0.1));
  const bLen = Math.min(N - bStart, Math.floor(50 * sr));
  const bx = _monoSegment(L, R, bStart, bLen);
  const grid = detectBeatGrid(bx, sr, bStart / sr);
  // 調性:取 20% 處起最多 30 秒
  const kStart = Math.min(Math.floor(N * 0.2), Math.max(0, N - Math.floor(30 * sr)));
  const kx = _monoSegment(L, R, kStart, Math.min(N - kStart, Math.floor(30 * sr)));
  const key = detectKey(kx, sr);
  // 能量:整段 RMS 映射到 0..1
  let e = 0; const step = 4; let cnt = 0;
  for (let i = 0; i < N; i += step) { e += L[i] * L[i]; cnt++; }
  const rmsDb = 10 * Math.log10(e / Math.max(1, cnt) + 1e-12);
  const energy = Math.max(0, Math.min(1, (rmsDb + 26) / 14));
  return {
    bpm: grid ? grid.bpm : null, offset: grid ? grid.offset : 0,
    key: key ? key.key : null, keyConfidence: key ? key.confidence : 0,
    energy, duration: dur
  };
}

/* ---------- 諧波混音排序(貪婪最近鄰,模擬 Tiësto 式由低往高堆疊能量) ---------- */
function sortByHarmony(tracks, maxBpmDevPct) {
  maxBpmDevPct = maxBpmDevPct == null ? 16 : maxBpmDevPct;
  const ok = tracks.filter(t => t.bpm && t.key), rest = tracks.filter(t => !(t.bpm && t.key));
  if (!ok.length) return tracks.slice();
  const pool = ok.slice().sort((a, b) => a.bpm - b.bpm);
  const out = [pool.shift()];
  while (pool.length) {
    const cur = out[out.length - 1];
    let bestI = -1, bestCost = Infinity;
    for (let i = 0; i < pool.length; i++) {
      const c = pool[i];
      const m = matchTempoRatio(c.bpm, cur.bpm, maxBpmDevPct / 100);
      const bpmPct = Math.abs(m.ratio - 1) * 100;
      if (!m.exact) continue;
      const cost = compatibilityScore(cur.key, c.key) * 10 + bpmPct
                 + 5 * Math.max(0, (cur.energy || 0) - (c.energy || 0));   // 盡量不要能量往下掉
      if (cost < bestCost) { bestCost = cost; bestI = i; }
    }
    if (bestI < 0) {   // 沒有 BPM 可以接上的,退而求其次選最接近的
      bestI = 0; let d = Infinity;
      pool.forEach((c, i) => { const dd = Math.abs(c.bpm - cur.bpm); if (dd < d) { d = dd; bestI = i; } });
    }
    out.push(pool.splice(bestI, 1)[0]);
  }
  return out.concat(rest);
}

/* ============================================================================
 * 示範曲合成器:程序化產生四四拍電子舞曲(kick / hat / clap / bass / 和弦),
 * 讓使用者不用先準備音檔就能試玩,也用來驗證 BPM 與調性偵測的準確度。
 * ========================================================================== */
function synthDemoTrack(opts) {
  const sr = opts.sr || 32000, bpm = opts.bpm, bars = opts.bars || 24;
  const root = opts.root, minor = !!opts.minor;
  const beat = 60 / bpm, total = Math.floor(bars * 4 * beat * sr);
  const out = new Float32Array(total);
  let seed = (opts.seed || 1) >>> 0;
  const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296 * 2 - 1; };
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const TAU = 2 * Math.PI;
  const LUT_N = 8192, LUT = new Float32Array(LUT_N + 1);
  for (let i = 0; i <= LUT_N; i++) LUT[i] = Math.sin(TAU * i / LUT_N);
  const sinc = (ph) => { const x = ph * LUT_N, i = x | 0; return LUT[i] + (LUT[i + 1] - LUT[i]) * (x - i); };   // ph ∈ [0,1)

  // 和弦進行(以主音為 0 的半音):強調主和弦,調性才明確
  const chords = minor ? [[0, 3, 7], [0, 3, 7], [5, 8, 12], [7, 10, 14]]
                       : [[0, 4, 7], [0, 4, 7], [5, 9, 12], [7, 11, 14]];
  const barLen = 4 * beat, chordLen = 2 * barLen;
  // 每個和弦預先算好 12 個泛音頻率(3 音 × 4 泛音)與權重
  const padInc = chords.map(ch => { const a = []; for (const iv of ch) for (let h = 1; h <= 4; h++) a.push(hz(48 + root + iv) * h / sr); return a; });
  const padAmp = []; for (let n = 0; n < 3; n++) for (let h = 1; h <= 4; h++) padAmp.push(1 / (h * 1.4));
  const padPh = new Float64Array(12);
  const bassF = hz(36 + root), bassInc = bassF / sr;
  let bassPh = 0, bassSubPh = 0, bassLp = 0, hatPrev = 0, clapLp = 0, kickPhase = 0;
  let lastChord = -1;

  for (let i = 0; i < total; i++) {
    const t = i / sr, bar = (t / barLen) | 0, inBar = t - bar * barLen;
    const beatIdx = (inBar / beat) | 0, tb = inBar - beatIdx * beat;
    let v = 0;

    // Kick:每拍一下,音高從 160Hz 掃到 48Hz
    if (tb < 0.4) {
      kickPhase += (48 + 112 * Math.exp(-tb * 28)) / sr; if (kickPhase >= 1) kickPhase -= 1;
      v += 0.85 * sinc(kickPhase) * Math.exp(-tb * 7.5);
      if (tb < 0.004) v += 0.5 * (1 - tb / 0.004) * sinc((1500 * tb) % 1);   // 起音的敲擊感
    } else kickPhase = 0;
    const duck = 1 - 0.75 * Math.exp(-tb * 10);   // 側鏈:kick 出現時壓低其他聲部

    // Hi-hat:反拍 8 分音符
    const th = tb - beat / 2;
    if (th >= 0 && th < 0.07) { const n = rnd(); v += 0.22 * (n - hatPrev) * Math.exp(-th * 70); hatPrev = n; } else hatPrev = 0;

    // Clap:第 2、4 拍
    if ((beatIdx === 1 || beatIdx === 3) && tb < 0.15) {
      const n = rnd(); clapLp += 0.35 * (n - clapLp);
      v += 0.32 * (n - clapLp) * Math.exp(-tb * 22);
    }

    if (bar >= 2) {   // 前兩小節只有鼓
      // 貝斯:反拍 8 分音符,主音,octave 2
      const bt = (inBar + beat / 2) % beat;
      bassPh += bassInc; if (bassPh >= 1) bassPh -= 1;
      const saw = 2 * bassPh - 1;
      bassLp += 0.06 * (saw - bassLp);
      v += duck * Math.exp(-bt * 5.5) * (0.42 * bassLp + 0.28 * sinc(bassPh));

      // 和弦墊音(每兩小節換一個和弦,切換處各留 30ms 淡入淡出避免爆音)
      const ci = ((bar / 2) | 0) % 4, tc = t - Math.floor(t / chordLen) * chordLen;
      if (ci !== lastChord) { lastChord = ci; }
      const inc = padInc[ci];
      let pad = 0;
      for (let k = 0; k < 12; k++) { let ph = padPh[k] + inc[k]; if (ph >= 1) ph -= 1; padPh[k] = ph; pad += sinc(ph) * padAmp[k]; }
      const env = Math.min(1, tc / 0.03, (chordLen - tc) / 0.03);
      v += duck * 0.075 * pad * (env > 0 ? env : 0);
    }
    v *= 1.05;
    out[i] = v / (1 + Math.abs(v) * 0.6);   // 柔性削波
  }
  return out;
}

function encodeWav16(samples, sr) {
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Uint8Array(buf);
}

/* ============================================================================
 * 曲庫儲存(IndexedDB)+ 音源提供者(Source Provider)+ 匯入流程
 *
 * 音源架構:每個 provider 只負責「列出項目」和「把項目變成 Blob」,
 * 之後統一走 Importer.importBlob():解碼 → 分析 BPM/調性 → 存進曲庫。
 * 要新增雲端服務(例如 Google Drive),實作同樣的 list()/fetchBlob() 即可。
 * ========================================================================== */

/* ---------- 曲庫儲存 ---------- */
const Store = {
  db: null, mem: { meta: new Map(), audio: new Map() },   // IndexedDB 不可用時(如無痕模式)退回記憶體,關閉頁面就會消失
  persistent: false,

  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('djmixer', 1);
        rq.onupgradeneeded = () => { const db = rq.result; db.createObjectStore('meta', { keyPath: 'id' }); db.createObjectStore('audio'); };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error('blocked'));
      });
      this.persistent = true;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) { this.db = null; this.persistent = false; }
  },
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _done(tx) { return new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('寫入失敗,可能是儲存空間不足')); }); },

  async listMeta() {
    if (!this.db) return Array.from(this.mem.meta.values());
    return this._req(this.db.transaction('meta').objectStore('meta').getAll());
  },
  async putTrack(meta, blob) {
    if (!this.db) { this.mem.meta.set(meta.id, meta); this.mem.audio.set(meta.id, blob); return; }
    const tx = this.db.transaction(['meta', 'audio'], 'readwrite');
    tx.objectStore('meta').put(meta); tx.objectStore('audio').put(blob, meta.id);
    return this._done(tx);
  },
  async putMeta(meta) {
    if (!this.db) { this.mem.meta.set(meta.id, meta); return; }
    const tx = this.db.transaction('meta', 'readwrite'); tx.objectStore('meta').put(meta); return this._done(tx);
  },
  async getBlob(id) {
    if (!this.db) return this.mem.audio.get(id);
    return this._req(this.db.transaction('audio').objectStore('audio').get(id));
  },
  async remove(id) {
    if (!this.db) { this.mem.meta.delete(id); this.mem.audio.delete(id); return; }
    const tx = this.db.transaction(['meta', 'audio'], 'readwrite');
    tx.objectStore('meta').delete(id); tx.objectStore('audio').delete(id); return this._done(tx);
  },
  async usage() {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); return e; } } catch (e) {}
    return null;
  }
};

/* ---------- 匯入流程:解碼 → 分析 → 存檔 ---------- */
const AUDIO_EXT = /\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|aif|aiff|caf|mp4)$/i;
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function titleFromName(n) { return n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim() || '未命名'; }

const Importer = {
  async importBlob(engine, blob, info) {
    const ab = await blob.arrayBuffer();
    const buf = await engine.decode(ab);
    await new Promise(r => setTimeout(r, 0));            // 讓 UI 有機會更新
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
    const a = analyzeTrack(L, R, buf.sampleRate);
    const meta = {
      id: uid(), title: info.title, artist: info.artist || '', source: info.source || 'local',
      bpm: a.bpm, offset: a.offset, key: a.key, energy: a.energy, duration: a.duration,
      size: blob.size, added: Date.now()
    };
    await Store.putTrack(meta, blob);
    return meta;
  }
};

/* ---------- Provider:本機檔案 ---------- */
class LocalFileProvider {
  constructor() { this.id = 'local'; this.name = '本機檔案'; this.available = true; }
  /* files: FileList(來自 <input type=file>) */
  items(files) { return Array.from(files).map(f => ({ title: titleFromName(f.name), blob: f, source: 'local' })); }
}

/* ---------- Provider:網址(檔案主機必須允許 CORS,例如 GitHub Pages / Cloudflare R2 / 自己的伺服器) ---------- */
class UrlProvider {
  constructor() { this.id = 'url'; this.name = '網址'; this.available = true; }
  async fetchBlob(url, onProgress) {
    const r = await fetch(url, { mode: 'cors' });
    if (!r.ok) throw new Error('下載失敗(HTTP ' + r.status + ')');
    const total = +r.headers.get('content-length') || 0;
    if (!r.body || !r.body.getReader) return r.blob();
    const reader = r.body.getReader(), chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (onProgress && total) onProgress(got / total);
    }
    return new Blob(chunks, { type: r.headers.get('content-type') || 'audio/mpeg' });
  }
  titleFromUrl(url) { try { return titleFromName(decodeURIComponent(new URL(url).pathname.split('/').pop())); } catch (e) { return '網址曲目'; } }
}

/* ---------- Provider:Dropbox(雲端硬碟的示範實作) ----------
 * 用 Dropbox API v2(支援瀏覽器 CORS)。授權有兩種方式:
 *   1. 貼上 Access Token(到 Dropbox App Console 的自己的 App 頁面 Generate)——最簡單,適合自用
 *   2. OAuth2 PKCE:輸入 App key,導向 Dropbox 授權後回到本頁(需在 App Console 登記本頁網址為 Redirect URI)
 * 注意:這個 provider 我沒有辦法在沙盒中對真正的 Dropbox 帳號做端對端測試。 */
class DropboxProvider {
  constructor() { this.id = 'dropbox'; this.name = 'Dropbox'; this.available = true; }
  get token() { return localStorage.getItem('dbx_token') || ''; }
  set token(v) { if (v) localStorage.setItem('dbx_token', v); else localStorage.removeItem('dbx_token'); }
  _arg(o) { return JSON.stringify(o).replace(/[\u007f-\uffff]/g, c => '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4)); }

  async list(path) {
    const r = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
      method: 'POST', headers: { Authorization: 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path || '', recursive: false, limit: 300 })
    });
    if (!r.ok) throw new Error('Dropbox 錯誤 ' + r.status + ':' + (await r.text()).slice(0, 120));
    const j = await r.json();
    return j.entries.filter(e => e['.tag'] === 'folder' || (e['.tag'] === 'file' && AUDIO_EXT.test(e.name)));
  }
  async fetchBlob(entry, onProgress) {
    const r = await fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST', headers: { Authorization: 'Bearer ' + this.token, 'Dropbox-API-Arg': this._arg({ path: entry.path_lower }) }
    });
    if (!r.ok) throw new Error('下載失敗(HTTP ' + r.status + ')');
    return r.blob();
  }
  async startOAuth(appKey) {
    const bytes = crypto.getRandomValues(new Uint8Array(48));
    const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const verifier = b64(bytes);
    const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    sessionStorage.setItem('dbx_verifier', verifier); localStorage.setItem('dbx_key', appKey);
    const redirect = location.origin + location.pathname;
    location.href = 'https://www.dropbox.com/oauth2/authorize?response_type=code&code_challenge_method=S256'
      + '&client_id=' + encodeURIComponent(appKey) + '&code_challenge=' + challenge + '&redirect_uri=' + encodeURIComponent(redirect);
  }
  async finishOAuth() {
    const code = new URLSearchParams(location.search).get('code'), verifier = sessionStorage.getItem('dbx_verifier');
    if (!code || !verifier) return false;
    const body = new URLSearchParams({ grant_type: 'authorization_code', code, client_id: localStorage.getItem('dbx_key') || '',
      redirect_uri: location.origin + location.pathname, code_verifier: verifier });
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body });
    history.replaceState(null, '', location.pathname);
    if (!r.ok) throw new Error('Dropbox 授權失敗');
    this.token = (await r.json()).access_token; sessionStorage.removeItem('dbx_verifier');
    return true;
  }
}

/* ---------- SoundCloud / Tidal / Apple Music:瀏覽器做不到的 ---------- */
const UNAVAILABLE_PROVIDERS = [
  { id: 'soundcloud', name: 'SoundCloud', why: '官方 API 只提供內嵌播放器,不提供原始音訊串流給第三方混音,Web Audio 拿不到波形資料。' },
  { id: 'tidal', name: 'Tidal', why: '串流內容有 DRM 加密,只能在官方播放器內解密,無法送進自己的音訊引擎。' },
  { id: 'applemusic', name: 'Apple Music / Spotify', why: '同樣是 DRM 串流,授權條款也不允許轉進第三方混音。' },
